    ${sec('Gramática', x.grammar)}
    ${x.pitfalls && x.pitfalls.length ? `<h4>Errores típicos</h4><ul>${x.pitfalls.map(p=>`<li>${Utils.escapeHtml(p)}</li>`).join('')}</ul>` : ''}
    ${sec('Contraste', x.contrast)}
  </div>`;
}

/* inner = contents of the container; expanded = detail page (always open) vs. session cards (collapsed) */
function aiExplainInner(c, expanded){
  const x = c.explanation;
  if(x){
    const regen = expanded ? `<div class="btn-row" style="margin-top:8px;"><button class="btn ghost" data-action="ai-explain" data-id="${c.id}" data-expanded="1" data-regen="1">↻ Regenerar</button></div>` : '';
    if(expanded) return `<h3 style="margin-top:20px;">Explicación</h3>${explanationBodyHtml(x)}${regen}`;
    return `<details class="ai-box"><summary>Ver explicación</summary>${explanationBodyHtml(x)}</details>`;
  }
  return `<div class="ai-box"><button class="btn secondary" data-action="ai-explain" data-id="${c.id}" ${expanded?'data-expanded="1"':''}>✨ Explicar con IA</button></div>`;
}
function aiExplainHtml(c, expanded){
  return `<div id="aiHost_${c.id}" class="ai-host">${aiExplainInner(c, expanded)}</div>`;
}

function viewLibrary(query){

    concepts = concepts.filter(c => [c.expression,c.meaning,c.translation,c.notes,...(c.tags||[]),...(c.synonyms||[]),...(c.antonyms||[]),...(c.examples||[]).map(e=>e.text)]
      .join(' ').toLowerCase().includes(nq));
  }
  if(tagFilter) concepts = concepts.filter(c=>c.tags.includes(tagFilter));
  const allTags = Array.from(new Set(Data.allConcepts().flatMap(c=>c.tags))).sort();
  return `

/* Description text: "## " lines are headings, "- " lines are bullets, anything else a paragraph. Everything is escaped. */
function descToHtml(text){
  let html = '', list = [];
  const flush = ()=>{ if(list.length){ html += '<ul class="objectives">'+list.map(x=>`<li>${Utils.escapeHtml(x)}</li>`).join('')+'</ul>'; list = []; } };
  String(text||'').split('\n').forEach(raw=>{
    const ln = raw.trim();
    if(!ln){ flush(); return; }
    if(ln.indexOf('## ')===0){ flush(); html += `<h4 class="desc-h">${Utils.escapeHtml(ln.slice(3))}</h4>`; }
    else if(/^[-•]\s+/.test(ln)) list.push(ln.replace(/^[-•]\s+/,''));
    else { flush(); html += `<p class="muted">${Utils.escapeHtml(ln)}</p>`; }
  });
  flush();
  return html;
}
function descSummary(text){      // first real paragraph, for the lesson cards
  const line = String(text||'').split('\n').map(x=>x.trim()).find(x=>x && x.indexOf('## ')!==0 && !/^[-•]\s/.test(x));
  return line || '';
}

function lessonExplainHtml(l){
  const obj = l.objectives || [];
  return `${l.description ? `<p class="muted">${Utils.escapeHtml(l.description)}</p>` : ''}

    ${l.explanation ? `<h3 style="margin-top:18px;">Explicación</h3><div class="lesson-desc">${descToHtml(l.explanation)}</div>` : ''}
    <div class="btn-row" style="margin:10px 0 14px;"><button class="btn secondary" data-action="ai-explain-lesson" data-id="${l.id}">${l.explanation ? '↻ Regenerar explicación con IA' : '✨ Generar explicación con IA'}</button></div>
    ${!obj.length && !l.explanation ? '<p class="faint">Esta lección no tiene objetivos: la explicación se inferirá de sus conceptos.</p>' : ''}`;
}

function lessonStudyBtn(l, short){
  const b = SRS.lessonBatch(l.id);
  if(!b.batch.length) return '';
  const fresh = b.newLeft>0, extra = b.batch.length - b.newInBatch;
  const label = short
    ? (fresh ? `Study next ${b.batch.length}` : `Review ${b.batch.length}`)
    : (fresh ? `Study next batch (${b.newInBatch} new${extra ? ' + '+extra+' to review' : ''})` : `Review the ${b.batch.length} weakest`);
  return `<button class="btn" data-action="start-review" data-mode="lesson" data-lesson="${l.id}">${label}</button>`;
}
function lessonProgressLine(l){
  const b = SRS.lessonBatch(l.id), size = SRS.LESSON_BATCH;
  if(!b.total) return '';
  return b.newLeft>0
    ? `${b.studied} of ${b.total} studied · batch ${Math.floor(b.studied/size)+1} of ${Math.ceil(b.total/size)}`
    : `All ${b.total} concepts studied`;
}

function viewExercise(){
  const st = ReviewSession.state;
  if(!st) return `<div class="empty-state">No active session. <a href="#/dashboard">Go to dashboard</a></div>`;
  if(st.done) return viewSessionSummary();
  if(st.showIntro) return viewConceptCard(st.introConceptId, { eyebrow:'New concept · first time seeing this', buttonLabel:'Start practicing →' });
  if(st.showMistakeReview) return viewConceptCard(st.mistakeConceptId, { eyebrow:'Quick refresher', buttonLabel:'Continue →' });
  const ex = st.currentExercise;
  const concept = ex.concept;
  const progress = progressBarHtml(st);

  let body = '';
  // A native-language hint helps most where the learner has to build the sentence from
  // nothing (word order, error correction, free production) rather than just recognise it.
  const translationHint = concept.translation
    ? `<p class="faint" style="font-style:italic;margin:-4px 0 12px;">${Utils.escapeHtml(concept.translation)}</p>` : '';
  const hintHtml = (ex.raw && ex.raw.hint) ? `<p class="faint" style="margin:-8px 0 12px;">💡 ${Utils.escapeHtml(ex.raw.hint)}</p>` : '';
  // the translation of this very sentence beats the concept-level one when the author provided it
  const sentenceHint = (ex.type==='word_order' && ex.raw && ex.raw.translation)
    ? `<p class="faint" style="font-style:italic;margin:-4px 0 12px;">${Utils.escapeHtml(ex.raw.translation)}</p>` : translationHint;
  // typed answers stay visible (read-only) once checked, so they can be compared with the right one
  const ro = st.answered ? ` value="${Utils.escapeHtml(st.lastInput||'')}" readonly` : '';
  if(ex.type==='fill_blank'){
    // The sentence alone is often impossible to answer (many words fit), so always give a cue:
    // the author's hint, else the meaning of the expression, plus the sentence translation if there is one.
    const cue = (ex.raw && ex.raw.hint) ? ex.raw.hint : (concept.meaning || '');
    const cueHtml = cue ? `<p class="faint" style="margin:-8px 0 12px;">💡 ${Utils.escapeHtml(cue)}</p>` : '';
    const trHtml = (ex.raw && ex.raw.translation) ? `<p class="faint" style="font-style:italic;margin:-8px 0 12px;">${Utils.escapeHtml(ex.raw.translation)}</p>` : '';
    const nWords = String((ex.answers && ex.answers[0]) || '').trim().split(/\s+/).filter(Boolean).length;
    body = `<p class="prompt-text">${Utils.escapeHtml(ex.prompt)}</p>
      ${trHtml}${cueHtml}
      <input type="text" class="blank-input" id="answerInput" placeholder="type the missing part${nWords>1 ? ' ('+nWords+' words)' : ''}" autocomplete="off" autocapitalize="off" spellcheck="false"${ro}>`;
  } else if(ex.type==='meaning_choice' || ex.type==='expression_choice'){
    body = `<p class="prompt-text">${Utils.escapeHtml(ex.prompt)}</p>
      ${optionListHtml(ex, st)}`;
  } else if(ex.type==='choose_correct'){
    body = `<p class="faint">Which sentence is correct?</p>
      ${optionListHtml(ex, st)}`;
  } else if(ex.type==='multiple_choice'){
    body = `<p class="prompt-text">${Utils.escapeHtml(ex.prompt)}</p>
      ${hintHtml}
      ${optionListHtml(ex, st)}`;
  } else if(ex.type==='listening'){
    body = `<p class="faint">Which expression did you hear?</p>
      <button class="speak-btn" data-action="speak" data-text="${Utils.escapeHtml(ex.audioText)}" data-lang="${concept.language}">🔊</button>
      ${optionListHtml(ex, st)}`;
  } else if(ex.type==='dictation'){
    body = `<p class="faint">Listen and write exactly what you hear.</p>
      <button class="speak-btn" data-action="speak" data-text="${Utils.escapeHtml(ex.audioText)}" data-lang="${concept.language}">🔊</button>
      <input type="text" class="blank-input" id="answerInput" style="width:100%;" placeholder="type what you heard" autocomplete="off" autocapitalize="off" spellcheck="false"${ro}>`;
  } else if(ex.type==='error_correction'){
    body = `<p class="faint">Correct the sentence:</p>
      ${translationHint}
      <p class="prompt-text">❌ ${Utils.escapeHtml(ex.prompt)}</p>
      <input type="text" class="blank-input" id="answerInput" style="width:100%;" placeholder="write the correct sentence" autocomplete="off" autocapitalize="off" spellcheck="false"${ro}>`;
  } else if(ex.type==='word_order'){
    if(st.answered){
      body = `${sentenceHint}`;          // the comparison with your answer is shown in the feedback below
    } else {
      body = `<p class="faint">Tap or drag the words into place, or type the first letters of the next word.</p>
      ${sentenceHint}
      <div class="word-answer" id="wordAnswer"></div>
      <div class="word-bank" id="wordBank"></div>
      <input type="hidden" id="answerInput" value="">
      <input type="text" class="blank-input" id="wordPick" style="width:100%;" placeholder="type the first letters of a word to pick it" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the first letters of a word to place it. Space or Enter confirms a word that is the start of another. Backspace on an empty box removes the last word.">`;
    }
  } else if(ex.type==='production'){
    body = `<p class="prompt-text">${Utils.escapeHtml(ex.prompt)}</p>
      ${translationHint}
      <textarea class="textarea" id="answerInput" placeholder="Write here…"></textarea>`;
  }


  return `
  <div class="exercise-shell">
    ${progress}
    <div class="card">
      <span class="eyebrow">${concept.type.replace('_',' ')} · ${ex.type.replace('_',' ')}</span>
      ${body}
      ${!st.answered ? `<div class="btn-row"><button class="btn" id="submitAnswer">Check</button></div>` : renderFeedback(st, ex)}
    </div>
  </div>`;
}

function optionListHtml(ex, st){
  const norm = Utils.looseNormalize;
  return `<div class="option-list">${ex.options.map((o,n)=>{
    let cls = 'option';
    if(st.answered){
      if(ex.answers.some(a=>norm(a)===norm(o))) cls += ' correct';
      else if(st.lastInput!=null && norm(o)===norm(st.lastInput)) cls += ' incorrect';
    }
    return `<button class="${cls}" data-option="${Utils.escapeHtml(o)}"${st.answered ? ' disabled' : ''}><span class="opt-num" aria-hidden="true">${n+1}</span>${Utils.escapeHtml(o)}</button>`;
  }).join('')}</div>${st.answered ? '' : '<p class="faint kbd-hint" style="margin-top:8px;">Keyboard: 1–' + ex.options.length + ' to pick, or ↑ ↓ and Enter.</p>'}`;
}

/* Word-level comparison of what was typed against the right answer: words that differ are marked
   in both lines (red/struck in yours, green in the right one). */
function diffHtml(userStr, correctStr){
  const tok = s => String(s||'').trim().split(/\s+/).filter(Boolean);
  const u = tok(userStr), c = tok(correctStr), key = w => Utils.looseNormalize(w);
  const n = u.length, m = c.length;
  const dp = Array.from({length:n+1}, ()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i][j] = key(u[i])===key(c[j]) ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const uBad = new Array(n).fill(true), cBad = new Array(m).fill(true);
  let i = 0, j = 0;
  while(i<n && j<m){
    if(key(u[i])===key(c[j])){ uBad[i] = false; cBad[j] = false; i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]) i++; else j++;
  }
  const e = Utils.escapeHtml;
  return {
    user: u.map((w,k)=>uBad[k] ? `<span class="diff-bad">${e(w)}</span>` : e(w)).join(' '),
    correct: c.map((w,k)=>cBad[k] ? `<span class="diff-good">${e(w)}</span>` : e(w)).join(' ')
  };
}

function renderFeedback(st, ex){
  if(ex.type==='production'){
    return `<div class="feedback-banner ok">Reference example: "${Utils.escapeHtml(ex.reference)}"</div>
      <div class="btn-row"><button class="btn" id="continueBtn">Continue →</button></div>`;
  }
  if(st.isCorrect){
    return `<div class="feedback-banner ok">✅ Correct!</div>
      <div class="btn-row"><button class="btn" id="continueBtn">Continue →</button></div>`;
  }
  const typed = ['fill_blank','dictation','error_correction','word_order'].includes(ex.type);
  const user = String(st.lastInput==null ? '' : st.lastInput), correct = ex.answers[0];
  let uHtml = user.trim() ? Utils.escapeHtml(user) : '<em>(nothing)</em>', cHtml = Utils.escapeHtml(correct);
  if(typed && user.trim()){ const d = diffHtml(user, correct); uHtml = d.user; cHtml = d.correct; }
  const others = (ex.answers||[]).slice(1);
  const canSkip = ReviewSession.canSkip();
  return `<div class="feedback-banner bad">
      <div>❌ Not quite.</div>
      <div class="cmp"><span class="cmp-label">Your answer</span><span>${uHtml}</span></div>
      <div class="cmp"><span class="cmp-label">Correct</span><span>${cHtml}</span></div>
      ${others.length ? `<div class="cmp"><span class="cmp-label">Also valid</span><span>${others.map(o=>Utils.escapeHtml(o)).join(' · ')}</span></div>` : ''}
    </div>
    <div class="btn-row"><button class="btn" id="retryBtn">${ReviewSession.willRepeatNow() ? 'Try again' : 'Continue →'}</button>${canSkip ? '<button class="btn ghost" id="skipBtn">Skip</button>' : ''}</div>
    ${ReviewSession.willRepeatNow() ? '' : `<p class="faint" style="margin-top:8px;">We'll ask this one again a little later.</p>`}
`;
}

function render(){
  renderNav();
  const [path, query] = location.hash.replace('#/','').split('?');
  const parts = path.split('/');
  const view = document.getElementById('view');
  let html = '';
  switch(parts[0]){
    case '': case 'dashboard': html = viewDashboard(); break;
    case 'library': html = parts[1] ? viewConceptDetail(parts[1]) : viewLibrary(query); break;
    case 'lessons': html = parts[1] ? viewLessonDetail(parts[1]) : viewLessons(); break;
    case 'mistakes': html = viewMistakes(); break;
    case 'stats': html = viewStats(); break;
    case 'settings': html = viewSettings(); break;
    case 'review': html = viewExercise(); break;
    default: html = viewDashboard();
  }
  view.innerHTML = html;
  wireView(parts[0], query);
}

function wireView(route, query){
  if(route==='settings') wireSettings();
  if(route==='review') wireExercise();
  if(route==='library' && !location.hash.includes('/library/')){
    const el = document.getElementById('libSearch');
    if(el) el.addEventListener('input', debounce(e=>{
      const params = new URLSearchParams(query||'');
      params.set('q', e.target.value);
      if(!e.target.value) params.delete('q');
      location.hash = '#/library?'+params.toString();
    }, 350));
  }
}

function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

function wireSettings(){
  const s = Data.settings();
  const bind = (id, key, isNum)=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('change', e=>{
      s[key] = isNum ? parseFloat(e.target.value) : (e.target.value||null);
      Data.saveSettings();
      if(id==='setRate') document.getElementById('rateLabel').textContent = s.rate+'x';
      if(id==='setPitch') document.getElementById('pitchLabel').textContent = s.pitch;
    });
  };
  bind('setLang','lang'); bind('setVoice','voiceName'); bind('setRate','rate',true); bind('setPitch','pitch',true);
  const aiBind = (id, key)=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', e=>{ AI.config()[key] = e.target.value.trim(); AI.save(); });
  };
  aiBind('aiKey','apiKey'); aiBind('aiLang','nativeLang'); aiBind('aiModel','model');
  Storage.info().then(i=>{
    const el = document.getElementById('storageInfo'); if(!el) return;
    const mb = n=>n==null ? '?' : (n>=1073741824 ? (n/1073741824).toFixed(1)+' GB' : (n/1048576).toFixed(1)+' MB');
    el.textContent = (i.mode==='idb' ? 'IndexedDB' : 'localStorage (fallback, ~5 MB limit)')
      + ' · persistent: ' + (i.persisted==null ? 'unknown' : (i.persisted ? 'yes' : 'no'))
      + (i.usage!=null ? ' · ' + mb(i.usage) + ' used of ' + mb(i.quota) : '');
  });
  const ib = document.getElementById('installBtn'), ih = document.getElementById('installHint');
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  if(ib && deferredInstall) ib.style.display = '';
  if(ih){
    if(standalone) ih.textContent = 'Running as an installed app.';
    else if(!/^https?:$/.test(location.protocol)) ih.textContent = 'To install, serve the app over HTTPS (e.g. GitHub Pages).';
    else if(/iphone|ipad|ipod/i.test(navigator.userAgent)) ih.textContent = 'On iOS: Share → Add to Home Screen.';
  }
  const npd = document.getElementById('setNewPerDay');
  if(npd) npd.addEventListener('change', e=>{ Data.meta().newPerDay = parseInt(e.target.value)||0; Data.saveMeta(); });
  const restore = document.getElementById('restoreFile');
  if(restore) restore.addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{ const obj = JSON.parse(reader.result); Data.restoreBackup(obj); Utils.toast('Backup restored.'); render(); }
      catch(err){ Utils.toast('Could not read backup file.'); }
    };
    reader.readAsText(f);
  });
}

/* Index where a dragged word would be inserted among the placed words, from the pointer position
   and the on-screen rectangles of those words (in reading order, rows included). */
function wordDropIndex(x, y, rects){
  for(let i=0;i<rects.length;i++){
    const r = rects[i];
    if(y < r.top || (y <= r.bottom && x < r.left + r.width/2)) return i;
  }
  return rects.length;
}

/* Word-order exercise. Three ways to build the sentence:
   - tap a word to place it (tap a placed word to send it back)
   - drag a word from the bank into the answer at any position, reorder placed words, or drag one
     back to the bank (pointer events, so mouse and touch behave the same)
   - keyboard: type the first letters of a word in the box under the bank; as soon as only one
     different word still matches, it is placed (Space/Enter places an exact match that is also the
     start of a longer word; Backspace on an empty box removes the last placed word; Esc clears).
     Tab to a word, Enter/Space to place or remove it, ←/→ to move a placed word, also work. */
function wireWordOrder(ex){
  const bank = document.getElementById('wordBank');
  const answerEl = document.getElementById('wordAnswer');
  const hidden = document.getElementById('answerInput');
  let chosen = [];   // word indices in answer order
  const pick = document.getElementById('wordPick');
  let buf = '';      // letters typed so far for the next word
  // Matching ignores case, accents and punctuation (so "é" is typed "e", "don't" is typed "dont").
  const wkey = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
  const wkeys = ex.words.map(wkey);
  const candidates = prefix => ex.words.map((w,i)=>i).filter(i=>!chosen.includes(i) && wkeys[i] && wkeys[i].startsWith(prefix));
  function place(i){ chosen.push(i); buf=''; if(pick) pick.value=''; renderChips(); }

  function syncHidden(){ hidden.value = chosen.map(i=>ex.words[i]).join(' '); }

  function chipEl(i, where){
    const used = where==='bank' && chosen.includes(i);
    const chip = document.createElement('span');
    const isMatch = where==='bank' && !used && buf && wkeys[i].startsWith(buf);
    chip.className = 'word-chip' + (used ? ' used' : '') + (isMatch ? ' match' : '') + (where==='answer' ? ' answer-chip' : '');
    chip.textContent = ex.words[i];
    chip.dataset.idx = i; chip.dataset.where = where;
    chip.setAttribute('role','button');
    chip.tabIndex = used ? -1 : 0;
    chip.setAttribute('aria-label', ex.words[i] + (where==='answer' ? ', placed. Enter removes it, arrow keys move it.' : (used ? ', already used' : '. Enter adds it.')));
    if(!used){
      chip.addEventListener('pointerdown', e=>press(e, i, where, chip));
      chip.addEventListener('keydown', e=>chipKey(e, i, where));
    }
    return chip;
  }

  function renderChips(focus){
    bank.innerHTML = ''; answerEl.innerHTML = '';
    ex.words.forEach((w,i)=>bank.appendChild(chipEl(i,'bank')));
    chosen.forEach(i=>answerEl.appendChild(chipEl(i,'answer')));
    answerEl.classList.toggle('empty', !chosen.length);
    syncHidden();
    if(focus){
      const el = (focus.where==='answer' ? answerEl : bank).querySelector(`.word-chip[data-idx="${focus.i}"]`);
      if(el) el.focus();
    }
  }

  function chipKey(e, i, where){
    if(e.key==='Enter' || e.key===' '){
      e.preventDefault(); e.stopPropagation();                  // don't also trigger "Check"
      if(where==='bank'){ chosen.push(i); renderChips({i, where:'answer'}); }
      else { chosen = chosen.filter(x=>x!==i); renderChips({i, where:'bank'}); }
    } else if(where==='answer' && (e.key==='ArrowLeft' || e.key==='ArrowRight')){
      e.preventDefault(); e.stopPropagation();
      const p = chosen.indexOf(i), q = p + (e.key==='ArrowLeft' ? -1 : 1);
      if(q>=0 && q<chosen.length){ chosen[p] = chosen[q]; chosen[q] = i; renderChips({i, where:'answer'}); }
    }
  }

  function press(e, i, from, chip){
    if(e.pointerType==='mouse' && e.button!==0) return;
    const sx = e.clientX, sy = e.clientY, pid = e.pointerId;
    let drag = null;
    const rect = el => el.getBoundingClientRect();
    const inside = (r, x, y, pad) => x>=r.left-pad && x<=r.right+pad && y>=r.top-pad && y<=r.bottom+pad;
    const zoneAt = (x, y) => inside(rect(answerEl), x, y, 14) ? 'answer' : (inside(rect(bank), x, y, 14) ? 'bank' : null);
    const placed = () => Array.from(answerEl.querySelectorAll('.answer-chip')).filter(c=>c!==chip);

    function showMarker(index){
      if(!drag.marker){ drag.marker = document.createElement('span'); drag.marker.className = 'drop-marker'; }
      const list = placed();
      if(index < list.length) answerEl.insertBefore(drag.marker, list[index]); else answerEl.appendChild(drag.marker);
    }
    function hideMarker(){ if(drag && drag.marker && drag.marker.parentNode) drag.marker.remove(); }
    function startDrag(){
      const r = rect(chip);
      const ghost = chip.cloneNode(true);
      ghost.classList.remove('dragging'); ghost.classList.add('drag-ghost');
      ghost.style.width = r.width + 'px';
      document.body.appendChild(ghost);
      chip.classList.add('dragging');
      document.body.classList.add('is-dragging');
      drag = { ghost, w:r.width, h:r.height, zone:null, index:0, marker:null };
    }
    function onMove(ev){
      if(pid!==undefined && ev.pointerId!==pid) return;
      if(!drag){
        if(Math.hypot(ev.clientX-sx, ev.clientY-sy) < 6) return;     // still a tap
        startDrag();
      }
      drag.ghost.style.left = (ev.clientX - drag.w/2) + 'px';
      drag.ghost.style.top = (ev.clientY - drag.h/2) + 'px';
      drag.zone = zoneAt(ev.clientX, ev.clientY);
      if(drag.zone==='answer'){
        drag.index = wordDropIndex(ev.clientX, ev.clientY, placed().map(rect));
        showMarker(drag.index);
      } else hideMarker();
    }
    function cleanup(){
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onCancel);
      if(drag){ hideMarker(); drag.ghost.remove(); chip.classList.remove('dragging'); document.body.classList.remove('is-dragging'); }
    }
    function onCancel(){ cleanup(); }
    function onUp(ev){
      if(pid!==undefined && ev.pointerId!==pid) return;
      const d = drag;
      cleanup();
      if(!d){                                                              // a tap
        if(from==='bank') chosen.push(i); else chosen = chosen.filter(x=>x!==i);
      } else if(from==='bank'){
        if(d.zone==='answer') chosen.splice(d.index, 0, i);               // else: dropped nowhere, nothing happens
      } else if(d.zone==='bank'){
        chosen = chosen.filter(x=>x!==i);
      } else if(d.zone==='answer'){
        chosen = chosen.filter(x=>x!==i); chosen.splice(d.index, 0, i);
      }
      renderChips();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel);
  }

  if(pick){
    pick.addEventListener('input', ()=>{
      const next = wkey(pick.value);
      if(!next){ buf=''; pick.value=''; renderChips(); return; }
      const c = candidates(next);
      if(!c.length){                                   // no remaining word starts like that: ignore the keystroke
        pick.value = buf; pick.classList.add('nomatch'); setTimeout(()=>pick.classList.remove('nomatch'), 250);
        return;
      }
      buf = next; pick.value = next;
      if(new Set(c.map(i=>wkeys[i])).size===1) place(c[0]); else renderChips();   // only one distinct word left: take it
    });
    pick.addEventListener('keydown', e=>{
      if(e.key==='Backspace' && !pick.value){
        if(chosen.length){ e.preventDefault(); e.stopPropagation(); chosen.pop(); renderChips(); }
        return;
      }
      if(e.key==='Escape'){ buf=''; pick.value=''; renderChips(); return; }
      if((e.key==='Enter' || e.key===' ') && buf){      // confirm a word that is also the start of a longer one
        e.preventDefault(); e.stopPropagation();
        const exact = candidates(buf).filter(i=>wkeys[i]===buf);
        if(exact.length) place(exact[0]);
      }
    });
  }

  renderChips();
  if(pick && window.matchMedia && matchMedia('(pointer:fine)').matches) pick.focus();   // keyboard users can start typing at once
}

function wireExercise(){
  const st = ReviewSession.state;
  if(!st || st.done) return;
  if(st.showIntro || st.showMistakeReview){
    const btn = document.getElementById('introContinueBtn');
    if(btn) btn.addEventListener('click', ()=>{
      if(st.showIntro) ReviewSession.confirmIntro(); else ReviewSession.confirmMistakeReview();
      if(ReviewSession.state.done) ReviewSession.finish();
      render();
    });
    return;
  }
  const ex = st.currentExercise;
  document.querySelectorAll('.option').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(st.answered) return;
      document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      const val = btn.dataset.option;
      const isCorrect = ReviewSession.submit(val);
      document.querySelectorAll('.option').forEach(b=>{
        if(Utils.looseNormalize(b.dataset.option)===Utils.looseNormalize(ex.answers[0])) b.classList.add('correct');
        else if(b===btn && !isCorrect) b.classList.add('incorrect');
      });
      render();
    });
  });
  const submitBtn = document.getElementById('submitAnswer');
  if(submitBtn){
    submitBtn.addEventListener('click', ()=>{
      const input = document.getElementById('answerInput');
      const typed = document.getElementById('typedAnswer');            // word order: the sentence typed instead
      const val = (typed && typed.value.trim()) ? typed.value : (input ? input.value : '');
      ReviewSession.submit(val);
      render();
    });
  }
  if(ex.type==='word_order' && !st.answered){
    wireWordOrder(ex);
  }
  const continueBtn = document.getElementById('continueBtn');
  if(continueBtn){
    continueBtn.addEventListener('click', ()=>{
      ReviewSession.continueFromExercise();
      if(ReviewSession.state.done) ReviewSession.finish();
      render();
    });
  }
  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn) retryBtn.addEventListener('click', ()=>{ ReviewSession.deferRetry(); render(); });
  const skipBtn = document.getElementById('skipBtn');
  if(skipBtn) skipBtn.addEventListener('click', ()=>{
    ReviewSession.continueFromExercise();
    if(ReviewSession.state.done) ReviewSession.finish();
    render();
  });
  const inp = document.getElementById('answerInput');
  if(inp && !st.answered && (ex.type==='fill_blank' || ex.type==='dictation' || ex.type==='error_correction' || ex.type==='production')){
    inp.focus();
  }
}

/* Global click delegate for data-action buttons */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  if(action==='start-review'){
    const mode = el.dataset.mode;
    const opts = {};
    if(el.dataset.lesson) opts.lessonId = el.dataset.lesson;
    const started = ReviewSession.start(mode, opts);
    if(!started){ Utils.toast('Nothing to review for this mode yet.'); return; }
    if(location.hash === '#/review') render(); else location.hash = '#/review';
  }
  else if(action==='open-concept'){ location.hash = '#/library/'+el.dataset.id; }
  else if(action==='view-lesson'){ location.hash = '#/lessons/'+el.dataset.id; }
  else if(action==='speak'){ TTS.speak(el.dataset.text, {lang:el.dataset.lang}); }
  else if(action==='test-voice'){ TTS.speak('This is a test of the current voice settings.'); }
  else if(action==='record-toggle'){
    const key = el.dataset.key;
    if(Recorder.isRecording()){
      if(Recorder.activeKey()===key) Recorder.stop();
      return;
    }
    el.textContent = '⏺';
    el.classList.add('recording');
    Recorder.start(key, ()=>{
      el.textContent = '🎤';
      el.classList.remove('recording');
      const playBtn = el.parentElement.querySelector('.play-btn');
      if(playBtn) playBtn.classList.remove('hidden');
    });
  }
  else if(action==='record-play'){ Recorder.play(el.dataset.key); }
  else if(action==='open-import'){ openModal(importModalHtml()); wireImportModal(); }
  else if(action==='open-add-concept'){ openModal(addConceptModalHtml()); wireAddConceptModal(); }
  else if(action==='close-modal'){ closeModal(); }
  else if(action==='ai-explain'){
    const id = el.dataset.id, expanded = !!el.dataset.expanded;
    const c = Data.getConcept(id);
    if(!c || AI.isPending(id)) return;
    if(!AI.hasKey()){ Utils.toast('Añade tu API key de Gemini en Settings.'); return; }
    const host = ()=>document.getElementById('aiHost_'+id);   // may be gone if the user moved on
    el.disabled = true; el.textContent = 'Generando…';
    AI.explain(id).then(()=>{
      const h = host(); if(h) h.innerHTML = aiExplainInner(c, expanded);
      if(h && !expanded){ const d = h.querySelector('details'); if(d) d.open = true; }
    }).catch(err=>{
      const h = host();
      if(h){
        h.innerHTML = aiExplainInner(c, expanded) + `<div class="ai-error">${Utils.escapeHtml(err.message)}</div>`;
      } else Utils.toast(err.message);
    });
  }
  else if(action==='ai-detect-models'){
    const st = document.getElementById('aiModelStatus'), mi = document.getElementById('aiModel'), ki = document.getElementById('aiKey');
    if(ki && ki.value.trim() !== AI.config().apiKey){ AI.config().apiKey = ki.value.trim(); AI.save(); }
    if(!AI.hasKey()){ if(st) st.textContent = 'Primero pega tu API key.'; return; }
    el.disabled = true; if(st) st.textContent = 'Consultando…';
    AI.listModels().then(ids=>{
      const dl = document.getElementById('aiModels');
      if(dl) dl.innerHTML = ids.map(id=>`<option value="${Utils.escapeHtml(id)}"></option>`).join('');
      let msg = ids.length + ' models available: ' + ids.slice(0,8).join(', ') + (ids.length>8 ? '…' : '') + '.';
      const cur = AI.config().model;
      if(ids.length && !ids.includes(cur)){
        const best = AI.pickDefault(ids);
        AI.config().model = best; AI.save(); if(mi) mi.value = best;
        msg += ' "' + cur + '" is not available, switched to ' + best + '.';
      }
      if(st) st.textContent = msg;
    }).catch(err=>{ if(st) st.textContent = err.message; })
      .finally(()=>{ el.disabled = false; });
  }
  else if(action==='ai-explain-lesson'){
    const id = el.dataset.id, l = Data.getLesson(id);
    if(!l || AI.isPending('lesson:'+id)) return;
    if(!AI.hasKey()){ Utils.toast('Añade tu API key de Gemini en Settings.'); return; }
    if(l.explanation && l.explanationSource!=='ai' && !confirm('Esto reemplazará la explicación actual de la lección. ¿Continuar?')) return;
    const host = ()=>document.getElementById('lessonExplainHost');
    el.disabled = true; el.textContent = 'Generando…';
    AI.explainLesson(id).then(()=>{
      const h = host(); if(h) h.innerHTML = lessonExplainHtml(l);
    }).catch(err=>{
      const h = host();
      if(h) h.innerHTML = lessonExplainHtml(l) + `<div class="ai-error">${Utils.escapeHtml(err.message)}</div>`;
      else Utils.toast(err.message);
    });
  }
  else if(action==='install-app'){
    if(!deferredInstall) return;
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(()=>{ deferredInstall = null; el.style.display = 'none'; });
  }
  else if(action==='ai-reset-usage'){
    AI.resetUsage();
    const u = document.getElementById('aiUsage'); if(u) u.textContent = 'Used so far: 0 calls · 0 input tokens · 0 output tokens';
  }
  else if(action==='export-content'){ Utils.download('lingua-field-content.json', Data.exportContent()); }
  else if(action==='export-progress'){ Utils.download('lingua-field-progress.json', Data.exportProgress()); }
  else if(action==='export-everything'){ Utils.download('lingua-field-backup.json', Data.exportEverything()); }
});

function openModal(html){
  let holder = document.getElementById('modalHolder');
  if(!holder){ holder = document.createElement('div'); holder.id='modalHolder'; document.body.appendChild(holder); }
  holder.innerHTML = html;
}
function closeModal(){ const h = document.getElementById('modalHolder'); if(h) h.innerHTML=''; }

function wireImportModal(){
  const file = document.getElementById('importFile');
  file.addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let obj;
      try{ obj = JSON.parse(reader.result); }
      catch(err){ document.getElementById('importErrors').textContent = 'Invalid JSON: '+err.message; return; }
      const result = JSONImporter.install(obj);
      if(!result.ok){
        document.getElementById('importErrors').innerHTML = result.errors.map(Utils.escapeHtml).join('<br>');
      } else {
        const w = result.warnings || [];
        Utils.toast('Lesson "'+result.lesson.title+'" installed.'+(w.length ? ' ⚠ '+w.join(' ') : ''), w.length ? 9000 : 0);
        closeModal(); render();
      }
    };
    reader.readAsText(f);
  });
}

function wireAddConceptModal(){
  const form = document.getElementById('addConceptForm');
  form.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const id = Utils.uid('c_'+Utils.normalize(fd.get('expression')).replace(/\s+/g,'_'));
    const exText = fd.get('exampleText');
    const exBlank = fd.get('exampleBlank');
    const examples = exText ? [{ text:exText, blank: exBlank||exText, answers:[exBlank||exText] }] : [];
    const concept = {
      id, language: fd.get('language')||'en-US', level: fd.get('level')||'B2', type: fd.get('type'),
      expression: fd.get('expression'), meaning: fd.get('meaning'), translation:'', notes:'', ipa:'',
      etymology: fd.get('etymology')||'',
      patterns:[], examples, commonMistakes:[], synonyms:[], antonyms:[], related:[],
      tags: (fd.get('tags')||'').split(',').map(t=>t.trim()).filter(Boolean)
    };
    Data.upsertConcept(concept);
    let mine = Data.getLesson('lesson_my_concepts');
    if(!mine){ mine = { id:'lesson_my_concepts', version:1, language:concept.language, title:'My Concepts', level:'—', description:'Concepts you added yourself.', tags:[], prerequisites:[], conceptIds:[] }; }
    mine.conceptIds.push(id);
    Data.upsertLesson(mine);
    Utils.toast('Concept saved.');
    closeModal();
    location.hash = '#/library/'+id;
  });
}

/* Enter key drives the review flow: submits the current answer, continues once feedback
   is showing, or acknowledges an intro/refresher card. Skipped while typing inside a
   textarea (production exercises) so it doesn't fight multi-line input. */
document.addEventListener('keydown', e=>{
  const st = ReviewSession.state;
  if(!st || st.done) return;
  // Choice exercises: 1-9 pick that option, ↑/↓ move a highlight, Enter confirms the highlighted one.
  if(!e.ctrlKey && !e.metaKey && !e.altKey && !st.showIntro && !st.showMistakeReview && !st.answered && location.hash.startsWith('#/review')){
    const tg = e.target, typing = tg && (tg.tagName==='INPUT' || tg.tagName==='TEXTAREA' || tg.isContentEditable);
    const opts = typing ? [] : Array.from(document.querySelectorAll('#view .option-list .option'));
    if(opts.length){
      const cur = opts.findIndex(o=>o.classList.contains('kbd-focus'));
      if(/^[1-9]$/.test(e.key)){
        const o = opts[Number(e.key)-1];
        if(o){ e.preventDefault(); o.click(); }
        return;
      }
      if(e.key==='ArrowDown' || e.key==='ArrowUp'){
        e.preventDefault();
        const d = e.key==='ArrowDown' ? 1 : -1;
        const next = cur<0 ? (d>0 ? 0 : opts.length-1) : (cur+d+opts.length)%opts.length;
        opts.forEach(o=>o.classList.remove('kbd-focus'));
        opts[next].classList.add('kbd-focus'); opts[next].scrollIntoView({block:'nearest'});
        return;
      }
      if(e.key==='Enter' && cur>=0){ e.preventDefault(); opts[cur].click(); return; }
    }
  }
  if(e.key!=='Enter') return;
  if(e.target && e.target.tagName==='TEXTAREA') return;
  if(e.target && e.target.closest && e.target.closest('.ai-box, .ai-host')) return;
  if(st.showIntro || st.showMistakeReview){
    const btn = document.getElementById('introContinueBtn');
    if(btn) btn.click();
    return;
  }
  if(st.answered){
    const btn = document.getElementById('continueBtn') || document.getElementById('retryBtn');   // Enter = Continue, or Try again after a miss
    if(btn) btn.click();
  } else {
    const btn = document.getElementById('submitAnswer');
    if(btn) btn.click();
  }
});

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{
  if(!location.hash) location.hash = '#/dashboard';
  render();
});
if(document.readyState !== 'loading'){ if(!location.hash) location.hash = '#/dashboard'; render(); }

/* Service worker (PWA). Needs http(s): it does nothing on file://. */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(hadController) Utils.toast('New version installed. Reload to apply it.');
    hadController = true;
  });
  const reg = ()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('SW registration failed', e));
  if(document.readyState==='complete') reg(); else window.addEventListener('load', reg);
}

})().catch(err=>{
  console.error(err);
  const v = document.getElementById('view');
  if(v) v.innerHTML = '<div class="empty-state">Could not start the app: '+String(err && err.message || err)+'</div>';
});
