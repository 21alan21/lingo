<style>
:root{
  --paper:#EEF1EC;
  --paper-alt:#E3E8DD;
  --paper-deep:#DDE3D5;
  --ink:#1F2D28;
  --ink-soft:#4A5750;
  --ink-faint:#7C8880;
  --teal:#1F6F5C;
  --teal-soft:#DCEAE4;
  --rust:#B4502A;
  --rust-soft:#F4E1D6;
  --indigo:#4B4E9E;
  --indigo-soft:#E4E4F4;
  --gold:#B8862F;
  --gold-soft:#F1E4C7;
  --line:#C7CFC0;
  --shadow: 0 1px 2px rgba(31,45,40,.06), 0 6px 20px rgba(31,45,40,.06);
  --radius:10px;
  --font-display:"Fraunces", serif;
  --font-body:"IBM Plex Sans", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;color:var(--ink);margin:0 0 .4em;}
h1{font-size:1.9rem;}
h2{font-size:1.35rem;}
h3{font-size:1.05rem;}
p{margin:0 0 .8em;}
a{color:var(--indigo);}
button{font-family:var(--font-body);cursor:pointer;}
::selection{background:var(--gold-soft);}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

#root{max-width:1040px;margin:0 auto;padding:0 20px 80px;}
#topnav{
  display:flex;align-items:center;gap:18px;
  padding:16px 0 10px;
  border-bottom:1px solid var(--line);
  margin-bottom:22px;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;}
.brand-mark{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:1.35rem;color:var(--teal);}
.brand-sub{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;}
.navlinks{display:flex;gap:2px;flex-wrap:wrap;}
.navlink{
  font-family:var(--font-body);font-size:.86rem;font-weight:500;color:var(--ink-soft);
  padding:7px 11px;border-radius:7px;text-decoration:none;position:relative;
}
.navlink:hover{background:var(--paper-alt);}
.navlink.active{background:var(--ink);color:var(--paper);}
.navbadge{
  display:inline-block;min-width:16px;padding:0 4px;margin-left:5px;border-radius:8px;
  background:var(--rust);color:#fff;font-family:var(--font-mono);font-size:.65rem;line-height:16px;text-align:center;
}
.navsearch{
  background:var(--paper-alt);border:1px solid var(--line);border-radius:7px;padding:6px 10px;
  font-size:.82rem;color:var(--ink-soft);width:150px;font-family:var(--font-body);
}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.card + .card{margin-top:14px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.col{flex:1;min-width:220px;}
.muted{color:var(--ink-soft);}
.faint{color:var(--ink-faint);font-size:.82rem;}
.eyebrow{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px;display:block;}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.72rem;font-family:var(--font-mono);border:1px solid var(--line);color:var(--ink-soft);background:var(--paper-alt);}
.pill.teal{background:var(--teal-soft);color:var(--teal);border-color:transparent;}
.pill.rust{background:var(--rust-soft);color:var(--rust);border-color:transparent;}
.pill.indigo{background:var(--indigo-soft);color:var(--indigo);border-color:transparent;}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent;}

.btn{
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:7px;font-size:.86rem;font-weight:500;
}
.btn:hover{background:#132019;}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
.btn.secondary:hover{background:var(--paper-alt);}
.btn.ghost{background:transparent;color:var(--ink-soft);border-color:transparent;padding:6px 8px;}
.btn.ghost:hover{color:var(--ink);}
.btn.danger{background:var(--rust);border-color:var(--rust);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

/* ---- Concept card / notebook styling ---- */
.concept{
  border:1px solid var(--line);border-radius:var(--radius);background:#fff;
  padding:16px 18px 16px 46px;position:relative;box-shadow:var(--shadow);cursor:pointer;
}
.concept + .concept{margin-top:10px;}
.concept-tab{
  position:absolute;left:-1px;top:14px;bottom:14px;width:28px;
  display:flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;text-orientation:mixed;
  font-family:var(--font-mono);font-size:.62rem;letter-spacing:.04em;text-transform:uppercase;
  color:#fff;border-radius:0 6px 6px 0;
}
.concept-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.concept-expr{
  font-family:var(--font-display);font-weight:600;font-size:1.25rem;
  border-bottom:3px solid var(--gold-soft);padding-bottom:1px;
}
.concept-ipa{font-family:var(--font-mono);color:var(--ink-faint);font-size:.82rem;}
.concept-meaning{margin-top:6px;}
.mastery-track{height:5px;border-radius:4px;background:var(--paper-deep);margin-top:10px;overflow:hidden;}
.mastery-fill{height:100%;background:var(--teal);}
.tagset{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}

/* Type colors for tabs/pills */
.t-phrasal_verb{background:var(--teal);} .t-idiom{background:var(--rust);}
.t-collocation{background:var(--indigo);} .t-vocabulary{background:#5B6B60;}
.t-expression{background:var(--gold);} .t-grammar_pattern{background:#7A5CA8;}
.t-sentence_pattern{background:#7A5CA8;}

/* Dashboard */
.hero{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;}
.stat-block{text-align:center;flex:1;min-width:90px;}
.stat-num{font-family:var(--font-display);font-size:1.7rem;font-weight:600;}
.stat-label{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}

/* Loop diagram */
.loop-wrap{display:flex;justify-content:center;margin:10px 0;}

/* Exercise view */
.exercise-shell{max-width:640px;margin:0 auto;}
.prompt-text{font-family:var(--font-display);font-size:1.3rem;line-height:1.5;margin:10px 0 18px;}
.blank-input{
  font-family:var(--font-mono);font-size:1rem;border:none;border-bottom:2px solid var(--ink);
  background:transparent;padding:2px 4px;width:200px;color:var(--indigo);
}
.blank-input:focus{outline:none;border-color:var(--indigo);}
.option-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.option{
  text-align:left;border:1px solid var(--line);background:#fff;padding:11px 14px;border-radius:8px;
  font-size:.92rem;font-family:var(--font-body);
}
.option:hover{border-color:var(--indigo);}
.option.selected{border-color:var(--indigo);background:var(--indigo-soft);}
.option.correct{border-color:var(--teal);background:var(--teal-soft);}
.option.incorrect{border-color:var(--rust);background:var(--rust-soft);}
.word-chip{display:inline-block;border:1px solid var(--line);background:#fff;padding:6px 10px;border-radius:6px;margin:3px;font-size:.9rem;}
.word-chip.used{opacity:.35;pointer-events:none;}
.word-chip.answer-chip{cursor:grab;touch-action:none;user-select:none;}
.word-chip.answer-chip.dragging{opacity:.5;cursor:grabbing;border-color:var(--indigo);box-shadow:var(--shadow);}
.word-bank, .word-answer{min-height:44px;padding:6px;border:1px dashed var(--line);border-radius:8px;margin-bottom:10px;}
.textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--font-body);font-size:.92rem;}
.speak-btn{
  background:var(--teal-soft);color:var(--teal);border:none;border-radius:50%;
  width:52px;height:52px;font-size:1.3rem;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
}
.speak-btn:hover{background:var(--teal);color:#fff;}
.record-widget{display:inline-flex;align-items:center;gap:4px;}
.mic-btn{
  background:var(--rust-soft);color:var(--rust);border:none;border-radius:50%;
  width:36px;height:36px;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.mic-btn:hover{background:var(--rust);color:#fff;}
.mic-btn.recording{background:var(--rust);color:#fff;animation:mic-pulse 1s ease-in-out infinite;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,80,42,.5);}50%{box-shadow:0 0 0 6px rgba(180,80,42,0);}}
.play-btn{
  background:var(--indigo-soft);color:var(--indigo);border:none;border-radius:50%;
  width:36px;height:36px;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.play-btn:hover{background:var(--indigo);color:#fff;}
.play-btn.hidden{display:none;}
.feedback-banner{padding:12px 14px;border-radius:8px;margin-top:16px;font-size:.9rem;}
.feedback-banner.ok{background:var(--teal-soft);color:var(--teal);}
.feedback-banner.bad{background:var(--rust-soft);color:var(--rust);}

/* forms */
label{display:block;font-size:.8rem;font-weight:600;margin:12px 0 4px;color:var(--ink-soft);}
input[type=text],input[type=password],input[type=number],input[type=file],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-family:var(--font-body);font-size:.9rem;background:#fff;
}
.field-hint{font-size:.75rem;color:var(--ink-faint);margin-top:3px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(31,45,40,.4);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50;}
.modal{background:#fff;border-radius:12px;padding:24px;max-width:560px;width:100%;box-shadow:var(--shadow);}
.modal-close{float:right;background:none;border:none;font-size:1.1rem;color:var(--ink-faint);}

table{width:100%;border-collapse:collapse;font-size:.88rem;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);}
th{color:var(--ink-soft);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:.85rem;
  box-shadow:var(--shadow);z-index:100;
}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:640px){.grid-2{grid-template-columns:1fr;} .stat-block{min-width:70px;}}
.checkbox-row{display:flex;align-items:center;gap:8px;margin:8px 0;}
.checkbox-row input{width:auto;}
hr.rule{border:none;border-top:1px solid var(--line);margin:18px 0;}

/* lessons */
.clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.lesson-desc p{margin:4px 0;}
.desc-h{margin:16px 0 2px;font-size:.72rem;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);}
.lesson-desc .desc-h:first-child{margin-top:0;}
ul.objectives{margin:4px 0 10px;padding-left:20px;font-size:.92rem;}
ul.objectives li{margin:2px 0;}
/* AI explanations */
.ai-box{margin-top:18px;}
.ai-box > summary{cursor:pointer;color:var(--indigo);font-weight:600;font-size:.88rem;padding:6px 0;}
.ai-body{background:var(--indigo-soft);border-radius:8px;padding:12px 14px;margin-top:8px;font-size:.9rem;}
.ai-body h4{margin:12px 0 2px;font-size:.72rem;font-family:var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);}
.ai-body h4:first-child{margin-top:0;}
.ai-body p{margin:0;}
.ai-body ul{margin:2px 0 0;padding-left:18px;}
.ai-error{color:var(--rust);font-size:.82rem;margin-top:6px;}
</style>

<body>
<div id="root">
  <nav id="topnav"></nav>
  <main id="view"></main>
</div>
<script>
(async function(){
"use strict";

/* Captured early: the browser may fire this before the rest of the app has booted. */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredInstall = e;
  const b = document.getElementById('installBtn'); if(b) b.style.display = '';
});
window.addEventListener('appinstalled', ()=>{ deferredInstall = null; const b = document.getElementById('installBtn'); if(b) b.style.display = 'none'; });

/* =========================================================
   UTILS
   ========================================================= */
const Utils = {
  uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9); },
  shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; },
  sample(arr,n){ return Utils.shuffle(arr).slice(0,n); },
  clone(o){ return JSON.parse(JSON.stringify(o)); },
  escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  normalize(s){ return String(s||'').toLowerCase().trim().replace(/[.!?,;:]+$/,'').replace(/\s+/g,' '); },
  startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); },
  daysFromNow(days){ return Date.now() + days*24*60*60*1000; },
  fmtDate(ts){ if(!ts) return '—'; const d=new Date(ts); return d.toLocaleDateString(undefined,{day:'2-digit',month:'short'}); },
  fmtDateTime(ts){ const d=new Date(ts); return d.toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); },
  download(filename, text){
    const blob = new Blob([text], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  },
  toast(msg){
    let t = document.getElementById('toast');
    if(t) t.remove();
    t = document.createElement('div'); t.id='toast'; t.className='toast'; t.textContent=msg;
    document.body.appendChild(t);
    setTimeout(()=>{ t.remove(); }, 2600);
  }
};

/* =========================================================
   STORAGE  (abstraction layer)
   Primary backend: IndexedDB. The whole store is loaded into memory once at boot
   (Storage.init), so get() stays synchronous and the rest of the app doesn't change.
   set() updates memory immediately and writes to IndexedDB in the background (debounced,
   and flushed when the page is hidden/closed). Fallback: localStorage if IndexedDB fails.
   ========================================================= */
const Storage = (function(){
  const NS = 'langapp:';            // legacy localStorage namespace
  const DB_NAME = 'lingua-field', STORE = 'kv';
  const DATA_KEYS = ['concepts','lessons','srs','mistakes','meta','settings','ai'];
  let mode = 'localstorage';        // 'idb' | 'localstorage'
  let db = null, timer = null, warned = false;
  const cache = Object.create(null);
  const dirty = new Set(), removed = new Set();

  /* ---- IndexedDB helpers ---- */
  function openDb(){
    return new Promise((resolve, reject)=>{
      if(!('indexedDB' in window) || !window.indexedDB) return reject(new Error('IndexedDB unavailable'));
      let req;
      try{ req = indexedDB.open(DB_NAME, 1); }catch(e){ return reject(e); }
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
      req.onblocked = ()=>reject(new Error('IndexedDB blocked'));
    });
  }
  function readAll(){
    return new Promise((resolve, reject)=>{
      const out = {};
      const rq = db.transaction(STORE,'readonly').objectStore(STORE).openCursor();
      rq.onsuccess = ()=>{ const cur = rq.result; if(cur){ out[cur.key] = cur.value; cur.continue(); } else resolve(out); };
      rq.onerror = ()=>reject(rq.error);
    });
  }
  function writeMany(entries, deletes){
    return new Promise((resolve, reject)=>{
      const tx = db.transaction(STORE,'readwrite'), st = tx.objectStore(STORE);
      entries.forEach(([k,v])=>st.put(v,k));      // put() snapshots the value right now
      (deletes||[]).forEach(k=>st.delete(k));
      tx.oncomplete = ()=>resolve();
      tx.onerror = tx.onabort = ()=>reject(tx.error || new Error('IndexedDB write failed'));
    });
  }

  /* ---- one-time migration from the old localStorage data ---- */
  async function migrateFromLocalStorage(){
    const found = {};
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf(NS)===0){
        try{ found[k.slice(NS.length)] = JSON.parse(localStorage.getItem(k)); }catch(e){}
      }
    }
    const keys = Object.keys(found);
    if(!keys.length) return;
    await writeMany(keys.map(k=>[k, found[k]]).concat([['_migration', { at:Date.now(), keys:keys.length }]]));
    const back = await readAll();
    const ok = keys.every(k=>JSON.stringify(back[k]) === JSON.stringify(found[k]));
    if(!ok){
      await writeMany([], keys.concat(['_migration']));       // undo, leave localStorage untouched
      throw new Error('Migration verification failed');
    }
    keys.forEach(k=>{ cache[k] = back[k]; });
    cache._migration = back._migration;
    keys.forEach(k=>localStorage.removeItem(NS+k));            // only after a verified copy
  }

  async function init(){
    try{
      db = await openDb();
      Object.assign(cache, await readAll());
      if(!DATA_KEYS.some(k=>k in cache)) await migrateFromLocalStorage();
      mode = 'idb';
      window.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flush(); });
      window.addEventListener('pagehide', flush);
      if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
    }catch(e){
      console.warn('IndexedDB not usable, falling back to localStorage:', e);
      mode = 'localstorage'; db = null;
    }
  }

  /* ---- public API (same shape as before) ---- */
  function get(key, fallback){
    if(mode==='idb') return key in cache ? cache[key] : fallback;
    try{
      const raw = localStorage.getItem(NS+key);
      return raw==null ? fallback : JSON.parse(raw);
    }catch(e){ return fallback; }
  }
  function set(key, value){
    if(mode==='idb'){
      cache[key] = value; dirty.add(key); removed.delete(key);
      clearTimeout(timer); timer = setTimeout(flush, 250);
      return true;
    }
    try{ localStorage.setItem(NS+key, JSON.stringify(value)); return true; }
    catch(e){ console.error('Storage error', e); if(!warned){ warned = true; Utils.toast('Storage full: export a backup.'); } return false; }
  }
  function remove(key){
    if(mode==='idb'){ delete cache[key]; dirty.delete(key); removed.add(key); clearTimeout(timer); timer = setTimeout(flush, 250); return; }
    localStorage.removeItem(NS+key);
  }
  function flush(){
    if(mode!=='idb' || !db) return Promise.resolve();
    clearTimeout(timer);
    if(!dirty.size && !removed.size) return Promise.resolve();
    const entries = Array.from(dirty).map(k=>[k, cache[k]]);
    const deletes = Array.from(removed);
    dirty.clear(); removed.clear();
    return writeMany(entries, deletes).catch(err=>{
      console.error('Storage write failed', err);
      entries.forEach(([k])=>dirty.add(k));                    // keep for a later retry
      if(!warned){ warned = true; Utils.toast('Could not save. Export a backup.'); }
    });
  }
  async function info(){
    const out = { mode, persisted:null, usage:null, quota:null };
    try{
      if(navigator.storage){
        if(navigator.storage.persisted) out.persisted = await navigator.storage.persisted();
        if(navigator.storage.estimate){ const e = await navigator.storage.estimate(); out.usage = e.usage; out.quota = e.quota; }
      }
    }catch(e){}
    return out;
  }
  return { init, get, set, remove, flush, info, mode:()=>mode };
})();
await Storage.init();

/* =========================================================
   SEED DATA
   ========================================================= */
function seedConcepts(){
  const mk = (o)=>Object.assign({
    id:o.id, language:'en-US', level:o.level||'B2', translation:'', notes:'', etymology:'',
    ipa:'', synonyms:[], antonyms:[], related:[], tags:[], commonMistakes:[], patterns:[]
  }, o);

  return [

function seedLessons(concepts){
  const travel = concepts.filter(c=>c.tags.includes('travel')).map(c=>c.id);
  const business = concepts.filter(c=>c.tags.includes('business')).map(c=>c.id);
  return [
    { id:'lesson_travel_pv', version:1, language:'en-US', title:'Travel Phrasal Verbs', level:'B2',
      description:'Essential phrasal verbs for getting through airports, hotels, and trips.',
      tags:['travel'], prerequisites:[], conceptIds:travel },
    { id:'lesson_business_idioms', version:1, language:'en-US', title:'Business Idioms & Collocations', level:'C1',
      description:'Natural expressions for meetings, planning, and everyday office talk.',
      tags:['business'], prerequisites:[], conceptIds:business }
  ];
}

/* =========================================================
   DATA STORE  (concepts, lessons, srs, mistakes, meta, settings)
   ========================================================= */
const Data = (function(){
  let concepts = Storage.get('concepts', null);
  let lessons = Storage.get('lessons', null);
  let srs = Storage.get('srs', {});
  let mistakes = Storage.get('mistakes', []);
  let meta = Storage.get('meta', { streak:0, longestStreak:0, lastActiveDate:null, totalStudySeconds:0, sessionsCompleted:0, newPerDay:5 });
  let settings = Storage.get('settings', { voiceName:null, rate:0.95, pitch:1.0, lang:'en-US' });

  if(!concepts){
    const seeded = seedConcepts();
    concepts = {}; seeded.forEach(c=>concepts[c.id]=c);
    Storage.set('concepts', concepts);
  }
  if(!lessons){
    const seededLessons = seedLessons(Object.values(concepts));
    lessons = {}; seededLessons.forEach(l=>lessons[l.id]=l);
    Storage.set('lessons', lessons);
  }
  Object.keys(concepts).forEach(id=>{ if(!srs[id]) srs[id]=freshSrs(id); });
  Storage.set('srs', srs);

  function freshSrs(conceptId){
    return { conceptId, firstSeen:null, lastReviewed:null, nextReview:Date.now(),
      interval:0, ease:2.5, repetitions:0, lapses:0, mastery:0, introSeen:false,
      modalityStats:{ reading:{correct:0,total:0}, listening:{correct:0,total:0}, production:{correct:0,total:0} } };
  }

  function persistAll(){
    Storage.set('concepts', concepts); Storage.set('lessons', lessons);
    Storage.set('srs', srs); Storage.set('mistakes', mistakes);
    Storage.set('meta', meta); Storage.set('settings', settings);
  }

  function touchActivity(){
    const today = Utils.startOfDay(Date.now());
    const last = meta.lastActiveDate;
    if(last !== today){
      const oneDay = 24*60*60*1000;
      meta.streak = (last === today-oneDay) ? meta.streak+1 : 1;
      meta.longestStreak = Math.max(meta.longestStreak, meta.streak);
      meta.lastActiveDate = today;
      Storage.set('meta', meta);
    }
  }

  return {
    getConcept: id=>concepts[id],
    allConcepts: ()=>Object.values(concepts),
    getLesson: id=>lessons[id],
    allLessons: ()=>Object.values(lessons),
    getSrs: id=>srs[id] || (srs[id]=freshSrs(id)),
    allSrs: ()=>srs,
    freshSrs,
    addMistake(m){ mistakes.unshift(Object.assign({date:Date.now()}, m)); mistakes = mistakes.slice(0,500); Storage.set('mistakes', mistakes); },
    allMistakes: ()=>mistakes,
    meta: ()=>meta, saveMeta(){ Storage.set('meta', meta); },
    settings: ()=>settings, saveSettings(){ Storage.set('settings', settings); },
    touchActivity,
    saveSrs(){ Storage.set('srs', srs); },
    saveConcepts(){ Storage.set('concepts', concepts); },
    saveLessons(){ Storage.set('lessons', lessons); },
    upsertConcept(c){ concepts[c.id]=c; if(!srs[c.id]) srs[c.id]=freshSrs(c.id); Storage.set('concepts', concepts); Storage.set('srs', srs); },
    upsertLesson(l){ lessons[l.id]=l; Storage.set('lessons', lessons); },
    persistAll,
    exportEverything(){
      return JSON.stringify({ formatVersion:'1.0', exportedAt:new Date().toISOString(),
        concepts, lessons, srs, mistakes, meta, settings }, null, 2);
    },
    exportContent(lessonIds){
      const ls = (lessonIds||Object.keys(lessons)).map(id=>lessons[id]).filter(Boolean);
      const cIds = new Set(); ls.forEach(l=>l.conceptIds.forEach(id=>cIds.add(id)));
      const cs = Array.from(cIds).map(id=>concepts[id]).filter(Boolean);
      return JSON.stringify({ formatVersion:'1.0', lessons:ls, concepts:cs }, null, 2);
    },
    exportProgress(){
      return JSON.stringify({ formatVersion:'1.0', srs, mistakes, meta }, null, 2);
    },
    restoreBackup(obj){
      if(obj.concepts) concepts = obj.concepts;
      if(obj.lessons) lessons = obj.lessons;
      if(obj.srs) srs = obj.srs;
      if(obj.mistakes) mistakes = obj.mistakes;
      if(obj.meta) meta = obj.meta;
      if(obj.settings) settings = obj.settings;
      persistAll();
    }
  };
})();

/* =========================================================
   JSON IMPORT / VALIDATION
   ========================================================= */
const JSONImporter = {
  validate(obj){
    const errors = [];
    if(typeof obj !== 'object' || obj===null) return ['El archivo no contiene un objeto JSON válido.'];
    if(!obj.formatVersion) errors.push('Falta el campo "formatVersion".');
    if(!obj.lesson || typeof obj.lesson!=='object') errors.push('Falta el objeto "lesson".');
    else{
      if(!obj.lesson.id) errors.push('lesson.id es obligatorio.');
      if(!obj.lesson.title) errors.push('lesson.title es obligatorio.');
      if(!obj.lesson.language) errors.push('lesson.language es obligatorio (ej. "en-US").');
      const ob = obj.lesson.objectives;
      if(ob!==undefined && (!Array.isArray(ob) || ob.some(o=>typeof o!=='string' || !o.trim())))
        errors.push('lesson.objectives debe ser un array de textos no vacíos.');
      if(obj.lesson.description!==undefined && typeof obj.lesson.description!=='string')
        errors.push('lesson.description debe ser un texto.');
      if(obj.lesson.explanation!==undefined && typeof obj.lesson.explanation!=='string')
        errors.push('lesson.explanation debe ser un texto.');
    }
    if(!Array.isArray(obj.concepts) || obj.concepts.length===0) errors.push('"concepts" debe ser un array con al menos un elemento.');
    else{
      const seen = new Set();
      obj.concepts.forEach((c,i)=>{
        if(!c.id) errors.push(`concepts[${i}]: falta "id".`);
        else if(seen.has(c.id)) errors.push(`concepts[${i}]: id duplicado "${c.id}".`);
        else seen.add(c.id);
        if(!c.expression) errors.push(`concepts[${i}] (${c.id||'?'}): falta "expression".`);
        if(!c.meaning) errors.push(`concepts[${i}] (${c.id||'?'}): falta "meaning".`);
        if(!c.type) errors.push(`concepts[${i}] (${c.id||'?'}): falta "type".`);
        if(c.examples && !Array.isArray(c.examples)) errors.push(`concepts[${i}] (${c.id||'?'}): "examples" debe ser un array.`);
      });
    }
    return errors;
  },
  install(obj){
    const errors = this.validate(obj);
    if(errors.length) return { ok:false, errors };
    const lang = obj.lesson.language;
    obj.concepts.forEach(c=>{
      const full = Object.assign({
        language:lang, level:c.level||'B2', translation:'', notes:'', ipa:'', etymology:'',
        synonyms:[], antonyms:[], related:[], tags:[], commonMistakes:[], patterns:[], examples:[]
      }, c);
      const prev = Data.getConcept(c.id);
      if(prev && prev.explanation && !full.explanation) full.explanation = prev.explanation;
      Data.upsertConcept(full);
    });
    const lesson = Object.assign({ version:1, language:lang, tags:[], prerequisites:[], objectives:[] }, obj.lesson,
      { conceptIds: obj.concepts.map(c=>c.id) });
    lesson.objectives = lesson.objectives.map(o=>o.trim());
    const prevLesson = Data.getLesson(lesson.id);
    const given = k => typeof obj.lesson[k]==='string' && obj.lesson[k].trim();
    ['description','explanation'].forEach(k=>{
      if(given(k)) lesson[k] = obj.lesson[k].trim();
      else if(prevLesson && prevLesson[k]){            // the file doesn't carry it: keep what the lesson already had
        lesson[k] = prevLesson[k];
        if(k==='explanation'){ if(prevLesson.explanationSource) lesson.explanationSource = prevLesson.explanationSource; }
      }
    });
    Data.upsertLesson(lesson);
    return { ok:true, lesson };
  }
};

/* =========================================================
   AI  (Google Gemini, called straight from the browser, on demand only)
   - concept explanation: one call per concept, cached in concept.explanation
   - lesson description: one call per lesson, built from its objectives, cached in lesson.description
   The API key lives under its own Storage key ('ai'), so it is NOT part of any export/backup.
   ========================================================= */
const AI = (function(){
  const ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
  const MODELS = [
    { id:'gemini-flash-latest', label:'Flash (latest, default)' },
    { id:'gemini-flash-lite-latest', label:'Flash-Lite (latest, cheapest)' },
    { id:'gemini-pro-latest', label:'Pro (latest, best quality)' }
  ];
  const NATIVE_LANGS = ['Spanish','English','Portuguese','French','Italian','German'];
  const defaults = { provider:'gemini', apiKey:'', model:MODELS[0].id, nativeLang:'Spanish', usage:{ calls:0, input:0, output:0 } };
  const stored = Storage.get('ai', {});
  let cfg = Object.assign({}, defaults, stored);
  if(stored.provider !== 'gemini'){          // settings left over from the previous (Claude) version: the old key is useless here
    cfg.apiKey = ''; cfg.model = defaults.model; cfg.usage = Object.assign({}, defaults.usage); cfg.provider = 'gemini';
    Storage.set('ai', cfg);
  }
  cfg.usage = Object.assign({}, defaults.usage, cfg.usage);
  const pending = {};

  function save(){ Storage.set('ai', cfg); }
  function hasKey(){ return !!(cfg.apiKey && cfg.apiKey.trim()); }
  const SYSTEM = 'You are a concise, practical language teacher. Respond with ONLY a valid JSON object: no markdown fences, no preamble.';

  /* ---- model discovery: ask the API which models this key can really use ---- */
  async function listModels(){
    if(!hasKey()) throw new Error('Primero pega tu API key.');
    let res;
    try{ res = await fetch(ENDPOINT.replace(/\/$/, '') + '?pageSize=1000', { headers:{ 'x-goog-api-key':cfg.apiKey.trim() } }); }
    catch(e){ throw new Error('Sin conexión o petición bloqueada.'); }
    if(!res.ok){
      let detail = ''; try{ const j = await res.json(); detail = j && j.error && j.error.message ? j.error.message : ''; }catch(e){}
      if(res.status===400 || res.status===401 || res.status===403) throw new Error('API key inválida o sin permisos.');
      throw new Error('Error '+res.status+(detail?': '+detail:''));
    }
    const data = await res.json();
    return (data.models || [])
      .filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
      .map(m=>String(m.name).replace(/^models\//,''))
      .filter(id=>/^gemini/.test(id) && !/embedding|tts|image|live|audio|imagen|veo|aqa|robotics|computer-use|native/.test(id))
      .sort();
  }
  function pickDefault(ids){
    if(!ids || !ids.length) return null;
    if(ids.includes('gemini-flash-latest')) return 'gemini-flash-latest';   // alias: never retired
    const ver = id=>{ const m = id.match(/gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
    const stable = ids.filter(id=>/flash/.test(id) && !/lite|preview|exp/.test(id)).sort((x,y)=>ver(y)-ver(x));
    if(stable.length) return stable[0];
    const lite = ids.filter(id=>/flash/.test(id)).sort((x,y)=>ver(y)-ver(x));
    return lite[0] || ids[0];
  }

  /* ---- one generic call; returns the raw text of the answer ---- */
  async function callGemini(userText, maxOut, opt){
    opt = opt || {};
    if(!hasKey()) throw new Error('Falta la API key de Gemini. Añádela en Settings.');
    const model = (cfg.model || defaults.model).trim();
    const gen = { maxOutputTokens:maxOut, temperature:0.4, responseMimeType:'application/json' };
    // 2.5 Flash "thinks" by default and thinking tokens are billed: switch it off for these short tasks.
    if(!opt.noThink && /gemini-2\.5-flash(?!-lite)/.test(model)) gen.thinkingConfig = { thinkingBudget:0 };
    let res;
    try{
      res = await fetch(ENDPOINT + encodeURIComponent(model) + ':generateContent', {
        method:'POST',
        headers:{ 'content-type':'application/json', 'x-goog-api-key':cfg.apiKey.trim() },
        body: JSON.stringify({
          systemInstruction:{ parts:[{ text:SYSTEM }] },
          contents:[{ role:'user', parts:[{ text:userText }] }],
          generationConfig:gen
        })
      });
    }catch(netErr){ throw new Error('Sin conexión o petición bloqueada.'); }
    if(!res.ok){
      let detail = '';
      try{ const j = await res.json(); detail = j && j.error && j.error.message ? j.error.message : ''; }catch(e){}
      if(res.status===400 && /thinking/i.test(detail) && !opt.noThink) return callGemini(userText, maxOut, Object.assign({}, opt, { noThink:true }));
      if((res.status===400 && /api key/i.test(detail)) || res.status===401 || res.status===403) throw new Error('API key inválida o sin permisos.');
      if(res.status===404){
        // The model was probably retired: look up what is available and retry once with the best one.
        if(!opt.recovered){
          let alt = null;
          try{ alt = pickDefault(await listModels()); }catch(e){}
          if(alt && alt!==model){
            cfg.model = alt; save();
            const mi = document.getElementById('aiModel'); if(mi) mi.value = alt;
            Utils.toast('Modelo '+model+' no disponible. Usando '+alt+'.');
            return callGemini(userText, maxOut, Object.assign({}, opt, { recovered:true }));
          }
        }
        throw new Error('Modelo no encontrado: '+model+'. Usa "Detect models" en Settings.');
      }
      if(res.status===429) throw new Error('Límite de uso alcanzado, inténtalo en un momento.');
      throw new Error('Error '+res.status+(detail?': '+detail:''));
    }
    const data = await res.json();
    const um = data.usageMetadata;
    if(um){
      cfg.usage.calls += 1;
      cfg.usage.input += um.promptTokenCount || 0;
      cfg.usage.output += (um.candidatesTokenCount || 0) + (um.thoughtsTokenCount || 0);
      save();
    }
    if(data.promptFeedback && data.promptFeedback.blockReason) throw new Error('Bloqueado por el filtro de Gemini ('+data.promptFeedback.blockReason+').');
    const cand = data.candidates && data.candidates[0];
    if(!cand) throw new Error('Respuesta vacía.');
    if(cand.finishReason==='MAX_TOKENS') throw new Error('La respuesta se cortó; inténtalo de nuevo.');
    const text = ((cand.content && cand.content.parts) || []).filter(p=>p.text && !p.thought).map(p=>p.text).join('');
    if(!text.trim()) throw new Error('Respuesta vacía'+(cand.finishReason?' ('+cand.finishReason+')':'')+'.');
    return text;
  }

  function parseJson(text){
    const a = text.indexOf('{'), b = text.lastIndexOf('}');
    if(a<0 || b<=a) throw new Error('La respuesta no contiene JSON.');
    try{ return JSON.parse(text.slice(a, b+1)); }
    catch(e){ throw new Error('La respuesta no es un JSON válido.'); }
  }
  const str = v => (typeof v==='string' ? v.trim() : '');

  /* ---------- concept explanation ---------- */
  function conceptPrompt(c){
    const ex = (c.examples||[]).slice(0,2).map(e=>'- '+e.text).join('\n');
    return `Target language: ${languageLabel(c.language)} (${c.language})
Learner's native language: ${cfg.nativeLang}. Write ALL explanation text in ${cfg.nativeLang}; keep target-language expressions and examples in the target language.
Learner level: ${c.level}
Concept type: ${String(c.type).replace('_',' ')}
Expression: ${c.expression}
Meaning: ${c.meaning}
${c.patterns && c.patterns.length ? 'Patterns: '+c.patterns.join(' | ')+'\n' : ''}${ex ? 'Examples:\n'+ex+'\n' : ''}
Explain this concept so the learner can USE it, not just recognise it. Be concise and concrete.
Return ONLY a JSON object with exactly these keys:
{"usage": "when and in what contexts it is used (2-3 sentences)",
 "register": "formality and tone, one short sentence",
 "grammar": "the grammatical pattern: structure, word order, prepositions, separability, tenses, etc. (2-3 sentences)",
 "pitfalls": ["2-3 typical mistakes for a ${cfg.nativeLang} speaker, each as: wrong form -> why it is wrong"],
 "contrast": "how it differs from the closest ${cfg.nativeLang} equivalent or from a similar expression (1-2 sentences)"}`;
  }
  function parseExplanation(text){
    const o = parseJson(text);
    const out = {
      usage:str(o.usage), register:str(o.register), grammar:str(o.grammar), contrast:str(o.contrast),
      pitfalls: Array.isArray(o.pitfalls) ? o.pitfalls.map(str).filter(Boolean) : []
    };
    if(!out.usage && !out.grammar) throw new Error('La respuesta no tiene el formato esperado.');
    return out;
  }
  async function explain(conceptId){
    const c = Data.getConcept(conceptId);
    if(!c) throw new Error('Concepto no encontrado.');
    if(pending[conceptId]) throw new Error('Ya se está generando.');
    pending[conceptId] = true;
    try{
      const exp = parseExplanation(await callGemini(conceptPrompt(c), 4096));
      exp.model = cfg.model; exp.lang = cfg.nativeLang; exp.createdAt = Date.now();
      c.explanation = exp;
      Data.saveConcepts();
      return exp;
    } finally { delete pending[conceptId]; }
  }

  /* ---------- lesson explanation (from objectives) ---------- */
  function lessonPrompt(l){
    const concepts = l.conceptIds.map(id=>Data.getConcept(id)).filter(Boolean).slice(0,30)
      .map(c=>'- '+c.expression+' — '+c.meaning).join('\n');
    const objectives = (l.objectives||[]).length
      ? l.objectives.map(o=>'- '+o).join('\n')
      : '(none provided: infer the goals from the concepts)';
    const N = cfg.nativeLang;
    return `Target language: ${languageLabel(l.language)} (${l.language})
Explanation language: ${N}. Write everything in ${N}, except target-language expressions and example sentences, which stay in the target language.
Level: ${l.level || 'not specified'}
Lesson title: ${l.title}
Learning objectives:
${objectives}
Concepts in this lesson:
${concepts}

TASK: write the EXPLANATION of this lesson's topic, as a mini-lesson. The learner must be able to UNDERSTAND the topic from this text alone, so TEACH it. Announcing or summarising the topic ("this lesson covers…") is not an explanation.
First identify the main topic from the objectives.

If the topic is GRAMMATICAL (a tense, structure, rule, contrast, construction), use these sections, in this order, each starting with a heading line "## " followed by a short heading in ${N}:
1. What it is: what it expresses and what problem it solves for the speaker.
2. How it is formed: the exact structure(s) as formulas (e.g. "if + past perfect, would + base verb"), each with one example in the target language.
3. When to use it: the situations, plus how it differs from the closest similar structures the learner may confuse it with.
4. Compared with ${N}: how it maps to, or differs from, the equivalent in ${N}.
5. Typical mistakes: 2-3 mistakes that ${N} speakers make, as "wrong → right" with a short reason.
If the topic is NOT grammatical (vocabulary, a theme, a situation), use these sections instead: "## " Context, How it is used, Typical mistakes.

RULES: 200-350 words in total. Use examples from the listed concepts whenever they fit. Plain text only: the only allowed markup is the "## " heading lines and "- " bullet lines. No bold, no asterisks, no other markdown. Separate sections with a blank line.
Return ONLY a JSON object: {"explanation": "..."} (use \\n inside the string for line breaks).`;
  }

  const wordCount = t => t.split(/\s+/).filter(Boolean).length;
  const headingCount = t => (t.match(/^## /gm) || []).length;
  function checkExplanation(d){
    const issues = [];
    if(wordCount(d) < 160) issues.push('It is too short ('+wordCount(d)+' words): it must be 200-350 words and actually teach the topic.');
    if(headingCount(d) < 3) issues.push('It must use at least 3 sections, each starting with a "## " heading line.');
    return issues;
  }
  async function generateExplanation(prompt){
    const o = parseJson(await callGemini(prompt, 4096));
    // plain text only: drop any markdown the model adds despite the instructions
    return str(o.explanation).replace(/\*\*/g,'').replace(/`/g,'').replace(/\r/g,'');
  }

  async function explainLesson(lessonId){
    const l = Data.getLesson(lessonId);
    if(!l) throw new Error('Lección no encontrada.');
    const key = 'lesson:'+lessonId;
    if(pending[key]) throw new Error('Ya se está generando.');
    pending[key] = true;
    try{
      const prompt = lessonPrompt(l);
      let d = await generateExplanation(prompt);
      const issues = checkExplanation(d);
      if(issues.length){             // too thin to teach anything: ask once more, with the reasons
        d = await generateExplanation(prompt + '\n\nYour previous answer was rejected. ' + issues.join(' ') + ' Rewrite it completely, fixing this.\nPrevious answer:\n' + d);
      }
      if(!d || wordCount(d) < 100) throw new Error('La explicación generada es demasiado superficial. Inténtalo de nuevo o prueba con un modelo más potente.');
      l.explanation = d; l.explanationSource = 'ai';
      Data.saveLessons();
      return d;
    } finally { delete pending[key]; }
  }

  return {
    MODELS, NATIVE_LANGS, explain, explainLesson, hasKey, listModels, pickDefault,
    config: ()=>cfg, save,
    isPending: id=>!!pending[id],
    resetUsage(){ cfg.usage = { calls:0, input:0, output:0 }; save(); }
  };
})();

/* =========================================================
   TTS ENGINE
   ========================================================= */
const TTS = (function(){
  const supported = 'speechSynthesis' in window;
  let voices = [];
  function loadVoices(){ if(supported) voices = window.speechSynthesis.getVoices(); return voices; }
  if(supported){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function speak(text, opts){
    if(!supported){ Utils.toast('Este navegador no soporta Text-to-Speech.'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const s = Data.settings();
    u.lang = (opts&&opts.lang) || s.lang || 'en-US';
    u.rate = (opts&&opts.rate) || s.rate || 1;
    u.pitch = (opts&&opts.pitch!=null) ? opts.pitch : (s.pitch!=null?s.pitch:1);
    if(s.voiceName){
      const v = voices.find(v=>v.name===s.voiceName);
      if(v) u.voice = v;
    }
    window.speechSynthesis.speak(u);
  }
  return { supported, speak, voices:()=>voices, loadVoices };
})();

/* =========================================================
   RECORDER (microphone record & playback — in-memory only,
   cleared on page reload; not persisted to storage)
   ========================================================= */
const Recorder = (function(){
  const supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  const blobs = {};   // key -> Blob
  const urls = {};    // key -> object URL (revoked when replaced)
  let mediaRecorder = null;
  let stream = null;
  let chunks = [];
  let activeKey = null;
  let currentAudio = null;
  let maxDurationTimer = null;

  function isRecording(){ return !!(mediaRecorder && mediaRecorder.state==='recording'); }
  function has(key){ return !!blobs[key]; }

  async function start(key, onStop){
    if(!supported){ Utils.toast('Recording is not supported in this browser.'); return false; }
    if(isRecording()) return false;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    }catch(err){
      Utils.toast('Microphone access was denied or is unavailable.');
      return false;
    }
    chunks = [];
    activeKey = key;
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      clearTimeout(maxDurationTimer);
      if(urls[key]) URL.revokeObjectURL(urls[key]);
      const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      blobs[key] = blob;
      urls[key] = URL.createObjectURL(blob);
      stream.getTracks().forEach(t=>t.stop());
      stream = null; mediaRecorder = null; activeKey = null;
      if(onStop) onStop(blob);
    };
    mediaRecorder.start();
    // Safety cutoff so a forgotten recording doesn't run forever.
    maxDurationTimer = setTimeout(()=>{ stop(); }, 15000);
    return true;
  }
  function stop(){ if(isRecording()) mediaRecorder.stop(); }
  function play(key){
    if(!blobs[key]) return;
    if(currentAudio){ currentAudio.pause(); }
    currentAudio = new Audio(urls[key]);
    currentAudio.play();
  }
  return { supported, isRecording, has, start, stop, play, activeKey:()=>activeKey };
})();

/* =========================================================
   SRS ENGINE (simplified SM-2)
   ========================================================= */
const SRS = {
  MODALITY_BY_EXTYPE: { fill_blank:'reading', multiple_choice:'reading', listening:'listening',
    dictation:'listening', error_correction:'production', word_order:'production', production:'production' },

  computeMastery(s){
    const mods = ['reading','listening','production'];
    let acc=0, count=0;
    mods.forEach(m=>{ const st=s.modalityStats[m]; if(st.total>0){ acc += st.correct/st.total; count++; } });
    const accuracyScore = count>0 ? (acc/count)*70 : 0;
    const repScore = Math.min(s.repetitions,10)/10*20;
    const breadthBonus = count>=2 ? 10 : (count===1?4:0);
    const lapsePenalty = Math.min(s.lapses*5,25);
    return Math.max(0, Math.min(100, Math.round(accuracyScore+repScore+breadthBonus-lapsePenalty)));
  },
  level(s){
    const modsUsed = ['reading','listening','production'].filter(m=>s.modalityStats[m].total>0).length;
    if(s.repetitions===0 && !s.lastReviewed) return 'New';
    if(s.mastery<28) return 'Learning';
    if(s.mastery<55) return 'Familiar';
    if(s.mastery<80 || modsUsed<2 || s.repetitions<5) return 'Strong';
    return 'Mastered';
  },
  recordAttempt(conceptId, exType, isCorrect){
    const s = Data.getSrs(conceptId);
    const mod = SRS.MODALITY_BY_EXTYPE[exType] || 'reading';
    s.modalityStats[mod].total++;
    if(isCorrect) s.modalityStats[mod].correct++;
    if(!s.firstSeen) s.firstSeen = Date.now();
  },
  schedule(conceptId, ratingKey){
    const s = Data.getSrs(conceptId);
    const qualityMap = { again:2, hard:3, good:4, easy:5 };
    const q = qualityMap[ratingKey] != null ? qualityMap[ratingKey] : 4;
    const now = Date.now();
    s.lastReviewed = now;
    if(!s.firstSeen) s.firstSeen = now;
    if(q<3){ s.lapses++; s.repetitions=0; s.interval=1; }
    else{
      if(s.repetitions===0) s.interval=1;
      else if(s.repetitions===1) s.interval=6;
      else s.interval=Math.round(s.interval*s.ease);
      s.repetitions++;
    }
    s.ease = Math.max(1.3, s.ease + (0.1-(5-q)*(0.08+(5-q)*0.02)));
    if(ratingKey==='hard') s.interval = Math.max(1, Math.round(s.interval*0.7));
    if(ratingKey==='easy') s.interval = Math.max(1, Math.round(s.interval*1.3));
    s.nextReview = now + s.interval*24*60*60*1000;
    s.mastery = SRS.computeMastery(s);
    Data.saveSrs();
    return s;
  },
  dueBucket(s){
    const now = Date.now(), startToday = Utils.startOfDay(now), endToday = startToday+24*60*60*1000;
    const endWeek = startToday+7*24*60*60*1000;
    if(s.nextReview<=now) return s.nextReview<startToday ? 'overdue' : 'dueNow';
    if(s.nextReview<endToday) return 'dueToday';
    if(s.nextReview<endToday+24*60*60*1000) return 'tomorrow';
    if(s.nextReview<endWeek) return 'thisWeek';
    return 'later';
  },
  buildQueue(mode, opts){
    opts = opts||{};
    const now = Date.now();
    const all = Data.allConcepts();
    let pool = [];
    if(mode==='lesson' && opts.lessonId){
      const lesson = Data.getLesson(opts.lessonId);
      pool = (lesson? lesson.conceptIds : []).map(id=>Data.getConcept(id)).filter(Boolean);
    } else if(mode==='weak'){
      pool = all.filter(c=>{ const s=Data.getSrs(c.id); return s.repetitions>0 && s.mastery<55; })
        .sort((a,b)=>Data.getSrs(a.id).mastery-Data.getSrs(b.id).mastery);
    } else if(mode==='mistakes'){
      const ids = Array.from(new Set(Data.allMistakes().map(m=>m.conceptId)));
      pool = ids.map(id=>Data.getConcept(id)).filter(Boolean);
    } else if(mode==='random'){
      pool = Utils.sample(all, Math.min(10, all.length));
    } else if(mode==='learn'){
      pool = all.filter(c=>Data.getSrs(c.id).repetitions===0);
      const limit = Math.max(1, Data.meta().newPerDay || 5);
      pool = pool.slice(0, limit);
    } else if(mode==='listening' || mode==='production'){
      pool = all.filter(c=>Data.getSrs(c.id).nextReview<=now || Data.getSrs(c.id).repetitions>0);
    } else { // daily / quick — due + limited new
      const due = all.filter(c=>Data.getSrs(c.id).nextReview<=now && Data.getSrs(c.id).repetitions>0)
        .sort((a,b)=>Data.getSrs(a.id).nextReview-Data.getSrs(b.id).nextReview);
      const fresh = all.filter(c=>Data.getSrs(c.id).repetitions===0)
        .slice(0, mode==='quick'?3:Data.meta().newPerDay);
      pool = due.concat(fresh);
    }
    if(mode==='quick') pool = pool.slice(0,7);
    if(opts.limit) pool = pool.slice(0, opts.limit);
    return pool;
  }
};

/* =========================================================
   EXERCISE ENGINE
   ========================================================= */
const Exercise = {
  // Difficulty tiers: a concept only "unlocks" harder exercise types as it accumulates
  // successful repetitions. Tier 1 (brand new) is recognition-only — no typing, no production.
  DIFFICULTY_TIERS: {
    1: ['multiple_choice','fill_blank'],                                            // first exposure: pure recognition
    2: ['multiple_choice','fill_blank','listening'],                                // add listening recognition
    3: ['multiple_choice','fill_blank','listening','word_order','error_correction'],// add constrained production
    4: ['multiple_choice','fill_blank','listening','word_order','error_correction','dictation','production'] // free production
  },
  // The tier at which each exercise type first becomes available — used to prefer the
  // *freshest* (hardest currently-unlocked) type rather than any cumulative one, so
  // difficulty strictly climbs instead of occasionally dipping back to something easier.
  TYPE_MIN_TIER: { multiple_choice:1, fill_blank:1, listening:2, word_order:3, error_correction:3, dictation:4, production:4 },
  tierFor(repetitions){
    const r = repetitions || 0;
    if(r<=0) return 1;
    if(r<=2) return 2;
    if(r<=4) return 3;
    return 4;
  },
  applicableTypes(concept, repetitions){
    const tier = Exercise.tierFor(repetitions);
    const allowed = Exercise.DIFFICULTY_TIERS[tier];
    const types = [];
    if(concept.examples && concept.examples.length){
      if(allowed.includes('fill_blank')) types.push('fill_blank');
      if(allowed.includes('multiple_choice')) types.push('multiple_choice');
      if(allowed.includes('listening')) types.push('listening');
      if(allowed.includes('dictation')) types.push('dictation');
    }
    if(allowed.includes('error_correction') && concept.commonMistakes && concept.commonMistakes.length) types.push('error_correction');
    if(allowed.includes('word_order') && concept.examples && concept.examples.some(e=>e.text.split(' ').length>=4)) types.push('word_order');
    if(allowed.includes('production')) types.push('production');
    // Safety net: a concept with no usable examples/mistakes at low tiers still needs something
    // to show — "production" only needs a meaning, not examples, so it always works.
    return types.length ? types : ['production'];
  },
  // repsOverride lets a session escalate difficulty across repeated attempts of the same
  // concept within one sitting, independent of the concept's persisted SRS repetitions.
  pickType(concept, srs, repsOverride){
    const reps = repsOverride!=null ? repsOverride : srs.repetitions;
    const tier = Exercise.tierFor(reps);
    const cumulative = Exercise.applicableTypes(concept, reps);
    // Prefer types native to the current tier so difficulty never quietly regresses; only
    // fall back to the next-highest tier the concept's data actually supports.
    let pool = cumulative.filter(t=>Exercise.TYPE_MIN_TIER[t]===tier);
    if(pool.length===0){
      const maxAvailableTier = Math.max(...cumulative.map(t=>Exercise.TYPE_MIN_TIER[t]));
      pool = cumulative.filter(t=>Exercise.TYPE_MIN_TIER[t]===maxAvailableTier);
    }
    // bias toward least-practiced modality within that pool
    const modTotals = { reading:srs.modalityStats.reading.total, listening:srs.modalityStats.listening.total, production:srs.modalityStats.production.total };
    const weighted = [];
    pool.forEach(t=>{
      const mod = SRS.MODALITY_BY_EXTYPE[t];
      const weight = 1 / (1+modTotals[mod]);
      for(let i=0;i<Math.ceil(weight*10);i++) weighted.push(t);
    });
    return weighted[Math.floor(Math.random()*weighted.length)];
  },
  distractorPool(concept, allConcepts){
    return allConcepts.filter(c=>c.id!==concept.id && c.type===concept.type && c.examples && c.examples.length);
  },
  generate(concept, type, allConcepts){
    type = type || 'fill_blank';
    const ex = concept.examples && concept.examples.length ? concept.examples[Math.floor(Math.random()*concept.examples.length)] : null;
    const base = { conceptId:concept.id, type, concept };
    if(type==='fill_blank'){
      return Object.assign(base, { prompt:ex.text.replace(ex.blank, '______'), answers:ex.answers, raw:ex });
    }
    if(type==='multiple_choice'){
      const distractors = Utils.sample(Exercise.distractorPool(concept, allConcepts), 3).map(c=>c.examples[0].blank);
      const options = Utils.shuffle([ex.answers[0], ...distractors].filter((v,i,a)=>a.indexOf(v)===i)).slice(0,4);
      return Object.assign(base, { prompt:ex.text.replace(ex.blank,'______'), options, answers:ex.answers, raw:ex });
    }
    if(type==='listening'){
      const distractors = Utils.sample(Exercise.distractorPool(concept, allConcepts), 3).map(c=>c.expression);
      const options = Utils.shuffle([concept.expression, ...distractors].filter((v,i,a)=>a.indexOf(v)===i)).slice(0,4);
      return Object.assign(base, { audioText:ex.text, options, answers:[concept.expression], raw:ex });
    }
    if(type==='dictation'){
      return Object.assign(base, { audioText:ex.text, answers:[ex.text], raw:ex });
    }
    if(type==='error_correction'){
      const m = concept.commonMistakes[Math.floor(Math.random()*concept.commonMistakes.length)];
      return Object.assign(base, { prompt:m.wrong, answers:[m.correct], raw:m });
    }
    if(type==='word_order'){
      const words = ex.text.replace(/[.?!]$/,'').split(' ');
      return Object.assign(base, { words: Utils.shuffle(words), answers:[ex.text.replace(/[.?!]$/,'')], raw:ex });
    }
    if(type==='production'){
      return Object.assign(base, { prompt:`Write your own sentence using "${concept.expression}".`, reference: ex?ex.text:concept.meaning });
    }
  },
  grade(exObj, userInput){
    const norm = Utils.normalize;
    if(exObj.type==='fill_blank' || exObj.type==='error_correction' || exObj.type==='dictation'){
      const ok = exObj.answers.some(a=>norm(a)===norm(userInput));
      return ok;
    }
    if(exObj.type==='multiple_choice' || exObj.type==='listening'){
      return exObj.answers.some(a=>norm(a)===norm(userInput));
    }
    if(exObj.type==='word_order'){
      return exObj.answers.some(a=>norm(a)===norm(userInput));
    }
    return null; // production: ungraded, self-rated
  }
};

/* =========================================================
   REVIEW SESSION CONTROLLER
   ========================================================= */
const ReviewSession = {
  state:null,
  // How many exercises a single concept gets in one sitting for "study" modes (lessons,
  // learning new material). Spaced-repetition-driven modes keep 1 touch per concept so
  // scheduling stays meaningful.
  REPS_PER_CONCEPT: { lesson:4, learn:4 },

  start(mode, opts){
    const queue = SRS.buildQueue(mode, opts||{});
    if(queue.length===0) return false;
    const repsPerConcept = this.REPS_PER_CONCEPT[mode] || 1;

    // All brand-new concepts get introduced first, in lesson order, before any quiz starts.
    const introQueue = queue.filter(c=>!Data.getSrs(c.id).introSeen).map(c=>c.id);

    // Build each concept's own easy→hard attempt sequence, then randomly interleave the
    // concepts (never their own internal order) so the next word is unpredictable.
    const perConceptSteps = {};
    queue.forEach(c=>{ perConceptSteps[c.id] = Array.from({length:repsPerConcept}, (_,i)=>i); });
    const activeIds = queue.map(c=>c.id);
    const steps = [];
    while(activeIds.some(id=>perConceptSteps[id].length)){
      const avail = activeIds.filter(id=>perConceptSteps[id].length);
      const pick = avail[Math.floor(Math.random()*avail.length)];
      const attemptIndex = perConceptSteps[pick].shift();
      steps.push({ conceptId:pick, attemptIndex });
    }

    this.state = {
      mode,
      conceptsById: Object.fromEntries(queue.map(c=>[c.id,c])),
      introQueue, steps, stepIndex:0,
      correctCount:0,
      currentExercise:null, currentStep:null, answered:false, isCorrect:null,
      showIntro:false, introConceptId:null,
      showMistakeReview:false, mistakeConceptId:null, retryCounts:{},
      startedAt:Date.now(), done:false,
      focusType: (mode==='listening') ? ['listening','dictation'] : (mode==='production' ? ['error_correction','word_order','production'] : null)
    };
    this.advance();
    return true;
  },
  pickTypeFor(concept, srs, repsOverride){
    const st = this.state;
    if(st.focusType){
      const applicable = Exercise.applicableTypes(concept, repsOverride!=null?repsOverride:srs.repetitions).filter(t=>st.focusType.includes(t));
      return applicable.length ? applicable[Math.floor(Math.random()*applicable.length)] : Exercise.pickType(concept, srs, repsOverride);
    }
    return Exercise.pickType(concept, srs, repsOverride);
  },
  // Moves to whatever should be shown next: remaining intros first, then the next exercise
  // step, then the session summary once everything is done.
  advance(){
    const st = this.state;
    st.showMistakeReview = false; st.mistakeConceptId = null;
    if(st.introQueue.length){
      st.showIntro = true;
      st.introConceptId = st.introQueue.shift();
      st.currentExercise = null;
      return;
    }
    st.showIntro = false;
    if(st.stepIndex >= st.steps.length){ st.done = true; return; }
    const step = st.steps[st.stepIndex];
    const concept = st.conceptsById[step.conceptId];
    const srs = Data.getSrs(concept.id);
    // Each attempt of the same concept within a session climbs exactly one difficulty tier
    // above wherever the concept's real progress currently places it — so a session always
    // moves from easiest to hardest, and a well-practiced concept starts (and finishes) harder.
    const baseTier = Exercise.tierFor(srs.repetitions);
    const sessionTier = Math.min(4, baseTier + step.attemptIndex);
    const repsForTier = { 1:0, 2:1, 3:3, 4:5 }[sessionTier];
    const type = this.pickTypeFor(concept, srs, repsForTier);
    st.currentExercise = Exercise.generate(concept, type, Data.allConcepts());
    st.currentStep = step;
    st.answered = false; st.isCorrect = null;
  },
  confirmIntro(){
    const st = this.state;
    const srs = Data.getSrs(st.introConceptId);
    srs.introSeen = true;
    Data.saveSrs();
    st.introConceptId = null;
    this.advance();
  },
  confirmMistakeReview(){
    this.advance();
  },
  submit(userInput){
    const st = this.state;
    const ex = st.currentExercise;
    const isCorrect = Exercise.grade(ex, userInput);
    st.answered = true; st.isCorrect = isCorrect; st.lastInput = userInput;
    if(isCorrect !== null){
      SRS.recordAttempt(ex.conceptId, ex.type, isCorrect);
      if(isCorrect) st.correctCount++;
      else Data.addMistake({ conceptId:ex.conceptId, exerciseType:ex.type, userAnswer:userInput, expected:ex.answers?ex.answers[0]:'' });
    }
    return isCorrect;
  },
  // Called when the learner clicks "Continue" after seeing feedback. If the answer was
  // wrong, a fresh attempt of the same concept is requeued later in the session — so getting
  // it wrong means practicing it again, not just reading a reminder — capped so a genuinely
  // confusing item can't grow the session forever. SRS scheduling for the concept only
  // finalises once no attempts of it remain pending.
  MAX_RETRIES_PER_CONCEPT: 2,
  continueFromExercise(){
    const st = this.state;
    const ex = st.currentExercise;
    const step = st.currentStep;
    const wasWrong = ex.type!=='production' && st.isCorrect===false;

    if(wasWrong){
      const retryCount = st.retryCounts[ex.conceptId] || 0;
      if(retryCount < this.MAX_RETRIES_PER_CONCEPT){
        st.retryCounts[ex.conceptId] = retryCount + 1;
        // Insert right after this step (not a random later spot) so the retry stays at the
        // same difficulty and never appears "before" a harder attempt of the same concept
        // that's already queued — the easy→hard order for this concept stays intact.
        st.steps.splice(st.stepIndex + 1, 0, { conceptId: ex.conceptId, attemptIndex: step.attemptIndex });
      }
    }

    const hasMoreForConcept = st.steps.slice(st.stepIndex+1).some(s=>s.conceptId===ex.conceptId);
    if(!hasMoreForConcept){
      const rating = ex.type==='production' ? 'good' : (st.isCorrect ? 'good' : 'again');
      SRS.schedule(ex.conceptId, rating);
      Data.saveConcepts();
    }

    st.stepIndex++;
    if(wasWrong){
      st.showMistakeReview = true;
      st.mistakeConceptId = ex.conceptId;
      st.currentExercise = null;
      return;
    }
    this.advance();
  },
  finish(){
    const st = this.state;
    const meta = Data.meta();
    meta.sessionsCompleted++;
    meta.totalStudySeconds += Math.round((Date.now()-st.startedAt)/1000);
    Data.saveMeta();
    Data.touchActivity();
  }
};

/* =========================================================
   STATISTICS
   ========================================================= */
const Stats = {
  dueCounts(){
    const buckets = { dueNow:0, dueToday:0, overdue:0, tomorrow:0, thisWeek:0, later:0 };
    Data.allConcepts().forEach(c=>{ const s=Data.getSrs(c.id); buckets[SRS.dueBucket(s)]++; });
    return buckets;
  },
  knowledge(){
    const counts = { New:0, Learning:0, Familiar:0, Strong:0, Mastered:0 };
    Data.allConcepts().forEach(c=>{ const s=Data.getSrs(c.id); counts[SRS.level(s)]++; });
    return counts;
  },
  weakAreas(){
    const byTag = {};
    Data.allConcepts().forEach(c=>{
      const s = Data.getSrs(c.id);
      if(s.repetitions===0) return;
      (c.tags.length?c.tags:[c.type]).forEach(tag=>{
        byTag[tag] = byTag[tag] || { total:0, sum:0 };
        byTag[tag].total++; byTag[tag].sum += s.mastery;
      });
    });
    return Object.entries(byTag).map(([tag,v])=>({ tag, avg: Math.round(v.sum/v.total) }))
      .sort((a,b)=>a.avg-b.avg);
  },
  today(){
    const todayStart = Utils.startOfDay(Date.now());
    const mistakesToday = Data.allMistakes().filter(m=>m.date>=todayStart).length;
    let reviewsToday=0, correctToday=0;
    Object.values(Data.allSrs()).forEach(s=>{ if(s.lastReviewed && s.lastReviewed>=todayStart) reviewsToday++; });
    return { reviewsToday, mistakesToday };
  }
};

function explanationBodyHtml(x){
  const sec = (title, text) => text ? `<h4>${title}</h4><p>${Utils.escapeHtml(text)}</p>` : '';
  return `<div class="ai-body">
    ${sec('Uso y contexto', x.usage)}

    ${sec('Gramática', x.grammar)}
    ${x.pitfalls && x.pitfalls.length ? `<h4>Errores típicos</h4><ul>${x.pitfalls.map(p=>`<li>${Utils.escapeHtml(p)}</li>`).join('')}</ul>` : ''}
    ${sec('Contraste', x.contrast)}
  </div>`;
}

/* inner = contents of the container; expanded = detail page (always open) vs. session cards (collapsed) */
function aiExplainInner(c, expanded){
  const x = c.explanation;
  if(x){
    const regen = expanded ? `<div class="btn-row" style="margin-top:8px;"><button class="btn ghost" data-action="ai-explain" data-id="${c.id}" data-expanded="1" data-regen="1">↻ Regenerar</button></div>` : '';
    if(expanded) return `<h3 style="margin-top:20px;">Explicación</h3>${explanationBodyHtml(x)}${regen}`;
    return `<details class="ai-box"><summary>Ver explicación</summary>${explanationBodyHtml(x)}</details>`;
  }
  return `<div class="ai-box"><button class="btn secondary" data-action="ai-explain" data-id="${c.id}" ${expanded?'data-expanded="1"':''}>✨ Explicar con IA</button></div>`;
}
function aiExplainHtml(c, expanded){
  return `<div id="aiHost_${c.id}" class="ai-host">${aiExplainInner(c, expanded)}</div>`;
}

/* Description text: "## " lines are headings, "- " lines are bullets, anything else a paragraph. Everything is escaped. */
function descToHtml(text){
  let html = '', list = [];
  const flush = ()=>{ if(list.length){ html += '<ul class="objectives">'+list.map(x=>`<li>${Utils.escapeHtml(x)}</li>`).join('')+'</ul>'; list = []; } };
  String(text||'').split('\n').forEach(raw=>{
    const ln = raw.trim();
    if(!ln){ flush(); return; }
    if(ln.indexOf('## ')===0){ flush(); html += `<h4 class="desc-h">${Utils.escapeHtml(ln.slice(3))}</h4>`; }
    else if(/^[-•]\s+/.test(ln)) list.push(ln.replace(/^[-•]\s+/,''));
    else { flush(); html += `<p class="muted">${Utils.escapeHtml(ln)}</p>`; }
  });
  flush();
  return html;
}
function descSummary(text){      // first real paragraph, for the lesson cards
  const line = String(text||'').split('\n').map(x=>x.trim()).find(x=>x && x.indexOf('## ')!==0 && !/^[-•]\s/.test(x));
  return line || '';
}

}

function viewExercise(){
  const st = ReviewSession.state;
  if(!st) return `<div class="empty-state">No active session. <a href="#/dashboard">Go to dashboard</a></div>`;
  if(st.done) return viewSessionSummary();
  if(st.showIntro) return viewConceptCard(st.introConceptId, { eyebrow:'New concept · first time seeing this', buttonLabel:'Start practicing →' });
  if(st.showMistakeReview) return viewConceptCard(st.mistakeConceptId, { eyebrow:'Quick refresher', buttonLabel:'Continue →' });
  const ex = st.currentExercise;
  const concept = ex.concept;
  const progress = progressBarHtml(st);

  let body = '';
  // A native-language hint helps most where the learner has to build the sentence from
  // nothing (word order, error correction, free production) rather than just recognise it.
  const translationHint = concept.translation
    ? `<p class="faint" style="font-style:italic;margin:-4px 0 12px;">${Utils.escapeHtml(concept.translation)}</p>` : '';
  if(ex.type==='fill_blank'){
    body = `<p class="prompt-text">${Utils.escapeHtml(ex.prompt)}</p>
      <input type="text" class="blank-input" id="answerInput" placeholder="type the missing part" autocomplete="off">`;
  } else if(ex.type==='multiple_choice'){
    body = `<p class="prompt-text">${Utils.escapeHtml(ex.prompt)}</p>
      <div class="option-list">${ex.options.map(o=>`<button class="option" data-option="${Utils.escapeHtml(o)}">${Utils.escapeHtml(o)}</button>`).join('')}</div>`;
  } else if(ex.type==='listening'){
    body = `<p class="faint">Which expression did you hear?</p>
      <button class="speak-btn" data-action="speak" data-text="${Utils.escapeHtml(ex.audioText)}" data-lang="${concept.language}">🔊</button>
      <div class="option-list">${ex.options.map(o=>`<button class="option" data-option="${Utils.escapeHtml(o)}">${Utils.escapeHtml(o)}</button>`).join('')}</div>`;
  } else if(ex.type==='dictation'){
    body = `<p class="faint">Listen and write exactly what you hear.</p>
      <button class="speak-btn" data-action="speak" data-text="${Utils.escapeHtml(ex.audioText)}" data-lang="${concept.language}">🔊</button>
      <input type="text" class="blank-input" id="answerInput" style="width:100%;" placeholder="type what you heard" autocomplete="off">`;
  } else if(ex.type==='error_correction'){
    body = `<p class="faint">Correct the sentence:</p>
      ${translationHint}
      <p class="prompt-text">❌ ${Utils.escapeHtml(ex.prompt)}</p>
      <input type="text" class="blank-input" id="answerInput" style="width:100%;" placeholder="write the correct sentence" autocomplete="off">`;
  } else if(ex.type==='word_order'){
    if(st.answered){
      body = `<p class="faint">Your answer:</p><p class="prompt-text">${Utils.escapeHtml(st.lastInput||'')}</p>`;
    } else {
      body = `<p class="faint">Tap a word to place it, tap a placed word to send it back, or drag a placed word between two others to reorder.</p>
      ${translationHint}
      <div class="word-answer" id="wordAnswer"></div>
      <div class="word-bank" id="wordBank"></div>
      <input type="hidden" id="answerInput" value="">`;
    }
  } else if(ex.type==='production'){
    body = `<p class="prompt-text">${Utils.escapeHtml(ex.prompt)}</p>
      ${translationHint}
      <textarea class="textarea" id="answerInput" placeholder="Write here…"></textarea>`;
  }


  return `
  <div class="exercise-shell">
    ${progress}
    <div class="card">
      <span class="eyebrow">${concept.type.replace('_',' ')} · ${ex.type.replace('_',' ')}</span>
      ${body}
      ${!st.answered ? `<div class="btn-row"><button class="btn" id="submitAnswer">Check</button></div>` : renderFeedback(st, ex)}
    </div>
  </div>`;
}

function renderFeedback(st, ex){
  let banner = '';
  if(ex.type==='production'){
    banner = `<div class="feedback-banner ok">Reference example: "${Utils.escapeHtml(ex.reference)}"</div>`;
  } else if(st.isCorrect){
    banner = `<div class="feedback-banner ok">✅ Correct!</div>`;
  } else {
    banner = `<div class="feedback-banner bad">❌ Not quite. Expected: "${Utils.escapeHtml(ex.answers[0])}"</div>`;
  }
  return `${banner}
    <div class="btn-row"><button class="btn" id="continueBtn">Continue →</button></div>`;
}
